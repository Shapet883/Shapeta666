<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shapeta Chess Kosova</title>
<style>
#gameResult {
    font-size: 22px;
    font-weight: bold;
    margin: 10px 0;
    padding: 8px 18px;
    display: inline-block;
    border: 2px solid #fff;
    border-radius: 8px;
    background: #333;
    min-height: 26px;
}
#gameResult:empty {
    display: none;
}
body {
    margin: 0;
    background: #222;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}
    
h1 {
    margin: 20px 0;
}
#gameArea {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 5px;
    margin: 20px 0 20px 195px;
}

#sidePanel {
    width: 220px;
    display: flex;
    flex-direction: column;
    align-items: center;
}
#board {
    width: 520px;
    height: 520px;
    margin: 20px 0;
    display: grid;
    grid-template-columns: repeat(8, 65px);
    grid-template-rows: repeat(8, 65px);
    border: 5px solid #111;
    box-sizing: content-box;
}

.square {
    width: 65px;
    height: 65px;
    box-sizing: border-box;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 56px;
    cursor: pointer;
}

.light {
    background: #b98f58;
}

.dark {
    background: #684526;
}

.white-piece {
    color: #ffffff;
    text-shadow:
    3px 0 0 #000,
    -3px 0 0 #000,
     0 3px 0 #000,
     0 -3px 0 #000;
}

.black-piece {
    color: #000000;
    text-shadow:
        3px 0 0 #fff,
        -3px 0 0 #fff,
        0 3px 0 #fff,
        0 -3px 0 #fff;
}

.selected {
    background: rgba(185, 212, 122, 0.55) !important;
    box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.18);
}

.in-check {
    background: red !important;
}


/* KOORDINATAT */

.square[data-file]::after {
    content: attr(data-file);
    position: absolute;
    bottom: 2px;
    right: 4px;
    font-size: 13px;
    font-weight: bold;
    color: #fff;
    text-shadow:
        1px 1px 2px #000,
        -1px -1px 2px #000,
        1px -1px 2px #000,
        -1px 1px 2px #000;
    pointer-events: none;
}

.square[data-rank]::before {
    content: attr(data-rank);
    position: absolute;
    top: 2px;
    left: 4px;
    font-size: 13px;
    font-weight: bold;
    color: #fff;
    text-shadow:
        1px 1px 2px #000,
        -1px -1px 2px #000,
        1px -1px 2px #000,
        -1px 1px 2px #000;
    pointer-events: none;
}

#newGameButton {
    margin: 10px 0 30px 0;
    padding: 10px 20px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 8px;
    border: 2px solid #111;
}
#turnIndicator {
    font-size: 20px;
    font-weight: bold;
    margin: 10px 0;
    padding: 8px 18px;
    display: inline-block;
    border: 2px solid #fff;
    border-radius: 8px;
    background: #333;
}
@media (max-width: 600px) {

    #board {
        width: 400px;
        height: 400px;
        grid-template-columns: repeat(8, 50px);
        grid-template-rows: repeat(8, 50px);
    }

    .square {
        width: 50px;
        height: 50px;
        font-size: 42px;
    }
}
#moveHistory {
    width: 500px;
    max-width: 90%;
    margin: 10px auto 30px auto;
    padding: 12px;
    box-sizing: border-box;
    background: #333;
    border: 2px solid #fff;
    border-radius: 8px;
    text-align: left;
    font-size: 16px;
    line-height: 1.6;
}
#blackClock,
#whiteClock {
    font-size: 24px;
    font-weight: bold;
    margin: 8px auto;
    padding: 8px 20px;
    display: block;
    width: fit-content;
    border: 2px solid #fff;
    border-radius: 8px;
    background: #333;
}
</style>
</head>

<body>

<h1>♟️ SHAPETA CHESS KOSOVA</h1>
<div id="turnIndicator">RADHA: BARDHI</div>

<div id="blackClock">ZI: 05:00</div>

<div id="gameResult"></div>

<div id="gameArea">

    <div id="board"></div>

    <div id="sidePanel">

        <button id="newGameButton">🔄 LOJA E RE</button>

        <div id="moveHistory">
            <strong>LËVIZJET</strong>
        </div>

    </div>

</div>

<div id="whiteClock">BARDHI: 05:00</div>
<script>

const board = document.getElementById("board");

const pieces = [

    "♜","♞","♝","♛","♚","♝","♞","♜",

    "♟","♟","♟","♟","♟","♟","♟","♟",

    "","","","","","","","",

    "","","","","","","","",

    "","","","","","","","",

    "","","","","","","","",

    "♙","♙","♙","♙","♙","♙","♙","♙",

    "♖","♘","♗","♕","♔","♗","♘","♖"

];

let selectedSquare = null;
let whiteTurn = true;
let lastMoveFrom = null;
let lastMoveTo = null;
let moveHistory = [];
let whiteTime = 5 * 60;
let blackTime = 5 * 60;
let clockInterval = null;
let clockStarted = false;
let gameOver = false;
let whiteKingMoved = false;
let blackKingMoved = false;
function updateClocks() {
    function formatTime(seconds) {
        const minutes = Math.floor(seconds / 60);
        const secs = seconds % 60;

        return String(minutes).padStart(2, "0") +
            ":" +
            String(secs).padStart(2, "0");
    }

    document.getElementById("whiteClock").textContent =
        "BARDHI: " + formatTime(whiteTime);

    document.getElementById("blackClock").textContent =
        "ZI: " + formatTime(blackTime);
}

function startClock() {

    if (clockStarted) {
        return;
    }

    clockStarted = true;

    clockInterval = setInterval(function () {

        if (whiteTurn) {
            whiteTime--;
        } else {
            blackTime--;
        }

        updateClocks();

        if (whiteTime <= 0 || blackTime <= 0) {
            clearInterval(clockInterval);
            clockInterval = null;
clockStarted = true;
           gameOver = true; 
            document.getElementById("gameResult").textContent =
                whiteTime <= 0
                    ? "🏆 KOHA MBAROI! FITON LOJTARI I ZI!"
                    : "🏆 KOHA MBAROI! FITON LOJTARI I BARDHË!";
        }

    }, 1000);
}

updateClocks();
let whiteRookLeftMoved = false;
let whiteRookRightMoved = false;

let blackRookLeftMoved = false;
let blackRookRightMoved = false;

function renderMoveHistory() {
    const box = document.getElementById("moveHistory");

    box.innerHTML = "<strong>LËVIZJET</strong>";

    for (let i = 0; i < moveHistory.length; i += 2) {
        const row = document.createElement("div");

        row.textContent =
            (Math.floor(i / 2) + 1) + ". " +
            moveHistory[i] +
            (moveHistory[i + 1]
                ? "    " + moveHistory[i + 1] 
                : "");

        box.appendChild(row);
    }
}
/* KRIJO TABELËN */

for (let i = 0; i < 64; i++) {

    const square = document.createElement("div");

    square.classList.add("square");

    if (
        (Math.floor(i / 8) + i % 8) % 2 === 0
    ) {
        square.classList.add("light");
    } else {
        square.classList.add("dark");
    }

    const row = Math.floor(i / 8);
    const col = i % 8;


    /* KOORDINATAT */

    if (row === 7) {
        square.dataset.file =
            String.fromCharCode(97 + col);
    }

    if (col === 0) {
        square.dataset.rank =
            8 - row;
    }


    /* FIGURAT */

    if (pieces[i] !== "") {

        square.textContent = pieces[i];

        if (
            "♔♕♖♗♘♙".includes(pieces[i])
        ) {
            square.classList.add("white-piece");
        } else {
            square.classList.add("black-piece");
        }
    }


    square.addEventListener(
        "click",
        function () {
            handleSquareClick(this, i);
        }
    );

    board.appendChild(square);
}


/* MERR FIGURËN PA KOORDINATA */

function getPiece(square) {
    return square.textContent;
}


/* KLIKO KATRORIN */

function handleSquareClick(square, index) {
if (gameOver) {
    return;
}
    const squares =
        Array.from(
            document.querySelectorAll(".square")
        );

    const piece =
        getPiece(square);


    /* ZGJIDH FIGURËN */

    if (selectedSquare === null) {

        if (piece === "") {
            return;
        }

        const isWhitePiece =
            "♔♕♖♗♘♙".includes(piece);

        if (isWhitePiece !== whiteTurn) {
            return;
        }

        selectedSquare = index;

        square.classList.add("selected");

        return;
    }


    /* KLIKIM PËRSËRI */

    if (selectedSquare === index) {

        square.classList.remove("selected");

        selectedSquare = null;

        return;
    }


    const from = selectedSquare;
    const to = index;

    const fromRow = Math.floor(from / 8);
    const fromCol = from % 8;

    const toRow = Math.floor(to / 8);
    const toCol = to % 8;

    const movingSquare = squares[from];
    const targetSquare = squares[to];

    const movingPiece =
        getPiece(movingSquare);

    const target =
        getPiece(targetSquare);

    const isWhitePiece =
        "♔♕♖♗♘♙".includes(movingPiece);

    if (isWhitePiece !== whiteTurn) {
        return;
    }


    const sameColor =
        target !== "" &&
        (
            "♔♕♖♗♘♙".includes(target)
            === isWhitePiece
        );


    let validMove = false;


    /* PIONI */

    if (
        movingPiece === "♙" ||
        movingPiece === "♟"
    ) {

        const direction =
            movingPiece === "♙" ? -1 : 1;

        const startRow =
            movingPiece === "♙" ? 6 : 1;


        if (
            toCol === fromCol &&
            toRow - fromRow === direction &&
            target === ""
        ) {
            validMove = true;
        }


        if (
            toCol === fromCol &&
            fromRow === startRow &&
            toRow - fromRow === direction * 2 &&
            target === "" &&
            getPiece(
                squares[from + direction * 8]
            ) === ""
        ) {
            validMove = true;
        }


        if (
            Math.abs(toCol - fromCol) === 1 &&
            toRow - fromRow === direction &&
            target !== "" &&
            !sameColor
        ) {
            validMove = true;
        }


        /* EN PASSANT */

        if (
            Math.abs(toCol - fromCol) === 1 &&
            toRow - fromRow === direction &&
            target === "" &&
            lastDoubleStep !== null
        ) {

            const lastIndex =
                lastDoubleStep.index;

            const lastPiece =
                lastDoubleStep.piece;

            const expectedIndex =
                fromRow * 8 +
                fromCol +
                (toCol - fromCol);

            if (
                lastIndex === expectedIndex &&
                (
                    lastPiece === "♙" ||
                    lastPiece === "♟"
                )
            ) {

                validMove = true;

                squares[lastIndex].textContent = "";

                squares[lastIndex]
                    .classList
                    .remove(
                        "white-piece",
                        "black-piece"
                    );
            }
        }
    }


    /* KALI */

    if (
        movingPiece === "♘" ||
        movingPiece === "♞"
    ) {

        const rowDiff =
            Math.abs(toRow - fromRow);

        const colDiff =
            Math.abs(toCol - fromCol);

        if (
            (
                rowDiff === 2 &&
                colDiff === 1
            ) ||
            (
                rowDiff === 1 &&
                colDiff === 2
            )
        ) {

            if (!sameColor) {
                validMove = true;
            }
        }
    }


    /* TORRA */

    if (
        movingPiece === "♖" ||
        movingPiece === "♜"
    ) {

        if (
            fromRow === toRow ||
            fromCol === toCol
        ) {

            let clear = true;

            const rowStep =
                toRow === fromRow
                    ? 0
                    : (toRow > fromRow ? 1 : -1);

            const colStep =
                toCol === fromCol
                    ? 0
                    : (toCol > fromCol ? 1 : -1);

            let r = fromRow + rowStep;
            let c = fromCol + colStep;

            while (
                r !== toRow ||
                c !== toCol
            ) {

                if (
                    getPiece(
                        squares[r * 8 + c]
                    ) !== ""
                ) {
                    clear = false;
                    break;
                }

                r += rowStep;
                c += colStep;
            }

            if (clear && !sameColor) {
                validMove = true;
            }
        }
    }


    /* FILI */

    if (
        movingPiece === "♗" ||
        movingPiece === "♝"
    ) {

        const rowDiff =
            Math.abs(toRow - fromRow);

        const colDiff =
            Math.abs(toCol - fromCol);

        if (rowDiff === colDiff) {

            let clear = true;

            const rowStep =
                toRow > fromRow ? 1 : -1;

            const colStep =
                toCol > fromCol ? 1 : -1;

            let r = fromRow + rowStep;
            let c = fromCol + colStep;

            while (
                r !== toRow ||
                c !== toCol
            ) {

                if (
                    getPiece(
                        squares[r * 8 + c]
                    ) !== ""
                ) {
                    clear = false;
                    break;
                }

                r += rowStep;
                c += colStep;
            }

            if (clear && !sameColor) {
                validMove = true;
            }
        }
    }


    /* MBRETËRESHA */

    if (
        movingPiece === "♕" ||
        movingPiece === "♛"
    ) {

        const rowDiff =
            Math.abs(toRow - fromRow);

        const colDiff =
            Math.abs(toCol - fromCol);

        const straight =
            fromRow === toRow ||
            fromCol === toCol;

        const diagonal =
            rowDiff === colDiff;

        if (straight || diagonal) {

            let clear = true;

            const rowStep =
                toRow === fromRow
                    ? 0
                    : (toRow > fromRow ? 1 : -1);

            const colStep =
                toCol === fromCol
                    ? 0
                    : (toCol > fromCol ? 1 : -1);

            let r = fromRow + rowStep;
            let c = fromCol + colStep;

            while (
                r !== toRow ||
                c !== toCol
            ) {

                if (
                    getPiece(
                        squares[r * 8 + c]
                    ) !== ""
                ) {
                    clear = false;
                    break;
                }

                r += rowStep;
                c += colStep;
            }

            if (clear && !sameColor) {
                validMove = true;
            }
        }
    }


    /* MBRETI */

    if (
        movingPiece === "♔" ||
        movingPiece === "♚"
    ) {

        const rowDiff =
            Math.abs(toRow - fromRow);

        const colDiff =
            Math.abs(toCol - fromCol);


        if (
            rowDiff <= 1 &&
            colDiff <= 1 &&
            rowDiff + colDiff > 0 &&
            !sameColor
        ) {
            validMove = true;
        }


        /* ROKADA */

        if (
            rowDiff === 0 &&
            colDiff === 2
        ) {

            if (
                movingPiece === "♔" &&
                fromRow === 7 &&
                fromCol === 4
            ) {

                if (
                    toCol === 6 &&
                    !whiteKingMoved &&
                    !whiteRookRightMoved &&
                    canCastle(true, true)
                ) {
                    validMove = true;
                }

                if (
                    toCol === 2 &&
                    !whiteKingMoved &&
                    !whiteRookLeftMoved &&
                    canCastle(true, false)
                ) {
                    validMove = true;
                }
            }


            if (
                movingPiece === "♚" &&
                fromRow === 0 &&
                fromCol === 4
            ) {

                if (
                    toCol === 6 &&
                    !blackKingMoved &&
                    !blackRookRightMoved &&
                    canCastle(false, true)
                ) {
                    validMove = true;
                }

                if (
                    toCol === 2 &&
                    !blackKingMoved &&
                    !blackRookLeftMoved &&
                    canCastle(false, false)
                ) {
                    validMove = true;
                }
            }
        }
    }


    /* MOS KAP MBRETIN */

    if (
        target === "♔" ||
        target === "♚"
    ) {
        validMove = false;
    }


    if (!validMove) {
        return;
    }


    /* RUAJ GJENDJEN */

    const oldFromText =
        squares[from].textContent;

    const oldToText =
        squares[to].textContent;

    const oldFromClasses =
        squares[from].className;

    const oldToClasses =
        squares[to].className;


    /* ROKADA */

    let isCastling = false;

    if (
        (
            movingPiece === "♔" ||
            movingPiece === "♚"
        ) &&
        Math.abs(toCol - fromCol) === 2
    ) {

        isCastling = true;


        if (
            movingPiece === "♔" &&
            toCol === 6
        ) {

            squares[63].textContent = "";
            squares[61].textContent = "♖";

            squares[63]
                .classList
                .remove(
                    "white-piece",
                    "black-piece"
                );

            squares[61]
                .classList
                .remove(
                    "white-piece",
                    "black-piece"
                );

            squares[61]
                .classList
                .add("white-piece");
        }


        if (
            movingPiece === "♔" &&
            toCol === 2
        ) {

            squares[56].textContent = "";
            squares[59].textContent = "♖";

            squares[56]
                .classList
                .remove(
                    "white-piece",
                    "black-piece"
                );

            squares[59]
                .classList
                .remove(
                    "white-piece",
                    "black-piece"
                );

            squares[59]
                .classList
                .add("white-piece");
        }


        if (
            movingPiece === "♚" &&
            toCol === 6
        ) {

            squares[7].textContent = "";
            squares[5].textContent = "♜";

            squares[7]
                .classList
                .remove(
                    "white-piece",
                    "black-piece"
                );

            squares[5]
                .classList
                .remove(
                    "white-piece",
                    "black-piece"
                );

            squares[5]
                .classList
                .add("black-piece");
        }


        if (
            movingPiece === "♚" &&
            toCol === 2
        ) {

            squares[0].textContent = "";
            squares[3].textContent = "♜";

            squares[0]
                .classList
                .remove(
                    "white-piece",
                    "black-piece"
                );

            squares[3]
                .classList
                .remove(
                    "white-piece",
                    "black-piece"
                );

            squares[3]
                .classList
                .add("black-piece");
        }
    }


    /* SHËNO LËVIZJET */

    if (movingPiece === "♔") {
        whiteKingMoved = true;
    }

    if (movingPiece === "♚") {
        blackKingMoved = true;
    }

    if (
        movingPiece === "♖" &&
        from === 56
    ) {
        whiteRookLeftMoved = true;
    }

    if (
        movingPiece === "♖" &&
        from === 63
    ) {
        whiteRookRightMoved = true;
    }

    if (
        movingPiece === "♜" &&
        from === 0
    ) {
        blackRookLeftMoved = true;
    }

    if (
        movingPiece === "♜" &&
        from === 7
    ) {
        blackRookRightMoved = true;
    }


    /* LËVIZ FIGURËN */

    squares[from].textContent = "";

    squares[from]
        .classList
        .remove(
            "white-piece",
            "black-piece",
            "selected"
        );

    squares[to].textContent =
        movingPiece;

    squares[to]
        .classList
        .remove(
            "white-piece",
            "black-piece"
        );

    squares[to]
        .classList
        .add(
            isWhitePiece
                ? "white-piece"
                : "black-piece"
        );


    /* DY HAPA I PIONIT */

    if (
        (
            movingPiece === "♙" ||
            movingPiece === "♟"
        ) &&
        Math.abs(toRow - fromRow) === 2
    ) {

        lastDoubleStep = {
            index: to,
            piece: movingPiece
        };

    } else {

        lastDoubleStep = null;
    }


    /* KONTROLLO MBRETIN */

    const ownKing =
        isWhitePiece ? "♔" : "♚";

    const ownKingIndex =
        squares.findIndex(
            s =>
                getPiece(s) === ownKing
        );


    if (
        ownKingIndex !== -1 &&
        isKingInCheck(
            squares[ownKingIndex]
        )
    ) {

        squares[from].textContent =
            oldFromText;

        squares[to].textContent =
            oldToText;

        squares[from].className =
            oldFromClasses;

        squares[to].className =
            oldToClasses;


        /* KTHE TORREN */

        if (isCastling) {

            if (
                movingPiece === "♔" &&
                toCol === 6
            ) {

                squares[61].textContent = "";
                squares[63].textContent = "♖";

                squares[61]
                    .classList
                    .remove("white-piece");

                squares[63]
                    .classList
                    .add("white-piece");
            }

            if (
                movingPiece === "♔" &&
                toCol === 2
            ) {

                squares[59].textContent = "";
                squares[56].textContent = "♖";

                squares[59]
                    .classList
                    .remove("white-piece");

                squares[56]
                    .classList
                    .add("white-piece");
            }

            if (
                movingPiece === "♚" &&
                toCol === 6
            ) {

                squares[5].textContent = "";
                squares[7].textContent = "♜";

                squares[5]
                    .classList
                    .remove("black-piece");

                squares[7]
                    .classList
                    .add("black-piece");
            }

            if (
                movingPiece === "♚" &&
                toCol === 2
            ) {

                squares[3].textContent = "";
                squares[0].textContent = "♜";

                squares[3]
                    .classList
                    .remove("black-piece");

                squares[0]
                    .classList
                    .add("black-piece");
            }
        }

        return;
    }


   /* SHËNO LËVIZJEN E FUNDIT */

if (lastMoveFrom !== null) {
    squares[lastMoveFrom].classList.remove("selected");
}

if (lastMoveTo !== null) {
    squares[lastMoveTo].classList.remove("selected");
}

lastMoveFrom = from;
lastMoveTo = to;

squares[lastMoveFrom].classList.add("selected");
squares[lastMoveTo].classList.add("selected");

selectedSquare = null; 


    /* PROMOVIMI I BARDHË */

    if (
        movingPiece === "♙" &&
        toRow === 0
    ) {

        const choice =
            prompt(
                "Promovim: q = Mbretëreshë, r = Torra, b = Fil, n = Kalë"
            );

        let newPiece = "♕";

        if (choice === "r") {
            newPiece = "♖";
        }

        if (choice === "b") {
            newPiece = "♗";
        }

        if (choice === "n") {
            newPiece = "♘";
        }

        squares[to].textContent =
            newPiece;

        squares[to]
            .classList
            .remove(

/* A KA LËVIZJE TË LEJUAR? */

function hasAnyLegalMove(isWhite) {

    const squares =
        Array.from(
            document.querySelectorAll(".square")
        );

    const ownPieces =
        isWhite
            ? ["♔","♕","♖","♗","♘","♙"]
            : ["♚","♛","♜","♝","♞","♟"];


    for (let from = 0; from < 64; from++) {

        const piece =
            getPiece(squares[from]);

        if (!ownPieces.includes(piece)) {
            continue;
        }


        for (let to = 0; to < 64; to++) {

            if (from === to) {
                continue;
            }

            const target =
                getPiece(squares[to]);

            if (
                target === "♔" ||
                target === "♚"
            ) {
                continue;
            }


            const fromRow =
                Math.floor(from / 8);

            const fromCol =
                from % 8;

            const toRow =
                Math.floor(to / 8);

            const toCol =
                to % 8;


            const sameColor =
                target !== "" &&
                (
                    "♔♕♖♗♘♙"
                    .includes(target)
                    === isWhite
                );

            if (sameColor) {
                continue;
            }


            let valid = false;


            /* PION */

            if (
                piece === "♙" ||
                piece === "♟"
            ) {

                const direction =
                    piece === "♙" ? -1 : 1;

                const startRow =
                    piece === "♙" ? 6 : 1;


                if (
                    toCol === fromCol &&
                    toRow - fromRow === direction &&
                    target === ""
                ) {
                    valid = true;
                }


                if (
                    toCol === fromCol &&
                    fromRow === startRow &&
                    toRow - fromRow === direction * 2 &&
                    target === "" &&
                    getPiece(
                        squares[
                            from + direction * 8
                        ]
                    ) === ""
                ) {
                    valid = true;
                }


                if (
                    Math.abs(
                        toCol - fromCol
                    ) === 1 &&
                    toRow - fromRow === direction &&
                    target !== ""
                ) {
                    valid = true;
                }
            }


            /* KALI */

            if (
                piece === "♘" ||
                piece === "♞"
            ) {

                const rd =
                    Math.abs(
                        toRow - fromRow
                    );

                const cd =
                    Math.abs(
                        toCol - fromCol
                    );

                if (
                    (
                        rd === 2 &&
                        cd === 1
                    ) ||
                    (
                        rd === 1 &&
                        cd === 2
                    )
                ) {
                    valid = true;
                }
            }


            /* TORRA */

            if (
                piece === "♖" ||
                piece === "♜"
            ) {

                if (
                    fromRow === toRow ||
                    fromCol === toCol
                ) {

                    let clear = true;

                    const rowStep =
                        toRow === fromRow
                            ? 0
                            : (
                                toRow > fromRow
                                    ? 1
                                    : -1
                            );

                    const colStep =
                        toCol === fromCol
                            ? 0
                            : (
                                toCol > fromCol
                                    ? 1
                                    : -1
                            );

                    let r =
                        fromRow + rowStep;

                    let c =
                        fromCol + colStep;

                    while (
                        r !== toRow ||
                        c !== toCol
                    ) {

                        if (
                            getPiece(
                                squares[r * 8 + c]
                            ) !== ""
                        ) {

                            clear = false;
                            break;
                        }

                        r += rowStep;
                        c += colStep;
                    }

                    if (clear) {
                        valid = true;
                    }
                }
            }


            /* FILI */

            if (
                piece === "♗" ||
                piece === "♝"
            ) {

                const rd =
                    Math.abs(
                        toRow - fromRow
                    );

                const cd =
                    Math.abs(
                        toCol - fromCol
                    );

                if (rd === cd) {

                    let clear = true;

                    const rowStep =
                        toRow > fromRow
                            ? 1
                            : -1;

                    const colStep =
                        toCol > fromCol
                            ? 1
                            : -1;

                    let r =
                        fromRow + rowStep;

                    let c =
                        fromCol + colStep;

                    while (
                        r !== toRow ||
                        c !== toCol
                    ) {

                        if (
                            getPiece(
                                squares[r * 8 + c]
                            ) !== ""
                        ) {

                            clear = false;
                            break;
                        }

                        r += rowStep;
                        c += colStep;
                    }

                    if (clear) {
                        valid = true;
                    }
                }
            }


            /* MBRETËRESHA */

            if (
                piece === "♕" ||
                piece === "♛"
            ) {

                const rd =
                    Math.abs(
                        toRow - fromRow
                    );

                const cd =
                    Math.abs(
                        toCol - fromCol
                    );

                const straight =
                    fromRow === toRow ||
                    fromCol === toCol;

                const diagonal =
                    rd === cd;

                if (straight || diagonal) {

                    let clear = true;

                    const rowStep =
                        toRow === fromRow
                            ? 0
                            : (
                                toRow > fromRow
                                    ? 1
                                    : -1
                            );

                    const colStep =
                        toCol === fromCol
                            ? 0
                            : (
                                toCol > fromCol
                                    ? 1
                                    : -1
                            );

                    let r =
                        fromRow + rowStep;

                    let c =
                        fromCol + colStep;

                    while (
                        r !== toRow ||
                        c !== toCol
                    ) {

                        if (
                            getPiece(
                                squares[r * 8 + c]
                            ) !== ""
                        ) {

                            clear = false;
                            break;
                        }

                        r += rowStep;
                        c += colStep;
                    }

                    if (clear) {
                        valid = true;
                    }
                }
            }


            /* MBRETI */

            if (
                piece === "♔" ||
                piece === "♚"
            ) {

                const rd =
                    Math.abs(
                        toRow - fromRow
                    );

                const cd =
                    Math.abs(
                        toCol - fromCol
                    );

                if (
                    rd <= 1 &&
                    cd <= 1 &&
                    rd + cd > 0
                ) {
                    valid = true;
                }
            }


            if (!valid) {
                continue;
            }


            /* PROVO LËVIZJEN */

            const oldFrom =
                squares[from].textContent;

            const oldTo =
                squares[to].textContent;

            squares[from].textContent = "";
            squares[to].textContent = piece;


            const kingPiece =
                isWhite ? "♔" : "♚";

            const kingIndex =
                squares.findIndex(
                    s =>
                        getPiece(s) === kingPiece
                );


            const leavesKingInCheck =
                kingIndex !== -1 &&
                isKingInCheck(
                    squares[kingIndex]
                );


            squares[from].textContent =
                oldFrom;

            squares[to].textContent =
                oldTo;


            if (!leavesKingInCheck) {
                return true;
            }
        }
    }

    return false;
}


/* SHAH-MAT */

function isCheckmate(isWhite) {

    const squares =
        Array.from(
            document.querySelectorAll(".square")
        );

    const kingPiece =
        isWhite ? "♔" : "♚";

    const kingSquare =
        squares.find(
            s =>
                getPiece(s) === kingPiece
        );

    if (!kingSquare) {
        return false;
    }

    if (!isKingInCheck(kingSquare)) {
        return false;
    }

    return !hasAnyLegalMove(isWhite);
}
/* REMI - VETËM DY MBRETËR */

function isKingVsKing() {

    const squares =
        Array.from(
            document.querySelectorAll(".square")
        );

    let piecesOnBoard = 0;

    for (const square of squares) {

        const piece = getPiece(square);

        if (piece !== "") {
            piecesOnBoard++;
        }

        if (
            piece !== "" &&
            piece !== "♔" &&
            piece !== "♚"
        ) {
            return false;
        }
    }

    return piecesOnBoard === 2;
}

/* ROKADA */

function canCastle(
    isWhite,
    shortCastle
) {

    const squares =
        Array.from(
            document.querySelectorAll(".square")
        );


    const kingIndex =
        isWhite ? 60 : 4;


    const rookIndex =
        isWhite
            ? (
                shortCastle

                    : 56
            )
            : (

                    ? 7
                    : 0
            );


    const emptySquares =
        isWhite
            ? (
                shortCastle
                    ? [61, 62]
                    : [57, 58, 59]
            )
            : (
                shortCastle
                    ? [5, 6]
                    : [1, 2, 3]
            );


    const kingPiece =
        isWhite ? "♔" : "♚";

    const rookPiece =
        isWhite ? "♖" : "♜";


    if (
        getPiece(
            squares[kingIndex]
        ) !== kingPiece
    ) {
        return false;
    }


    if (
        getPiece(
            squares[rookIndex]
        ) !== rookPiece
    ) {
        return false;
    }


    for (
        const index of emptySquares
    ) {

        if (
            getPiece(
                squares[index]
            ) !== ""
        ) {
            return false;
        }
    }


    if (
        isKingInCheck(
            squares[kingIndex]
        )
    ) {
        return false;
    }


    const middleIndex =
        shortCastle
            ? (
                isWhite ? 61 : 5
            )
            : (
                isWhite ? 59 : 3
            );


    const destinationIndex =
        shortCastle
            ? (
                isWhite ? 62 : 6
            )
            : (
                isWhite ? 58 : 2
            );


    /* KATRORI I MESËM */

    const oldKingText =
        squares[kingIndex].textContent;

    squares[kingIndex].textContent = "";

    squares[middleIndex].textContent =
        kingPiece;


    const middleInCheck =
        isKingInCheck(
            squares[middleIndex]
        );


    squares[middleIndex].textContent = "";

    squares[kingIndex].textContent =
        oldKingText;


    if (middleInCheck) {
        return false;
    }


    /* KATRORI I FUNDIT */

    squares[kingIndex].textContent = "";

    squares[destinationIndex].textContent =
        kingPiece;


    const destinationInCheck =
        isKingInCheck(
            squares[destinationIndex]
        );


    squares[destinationIndex].textContent = "";

    squares[kingIndex].textContent =
        oldKingText;


    if (destinationInCheck) {
        return false;
    }


    return true;
}


/* KONTROLLO SHAHUN */

function isKingInCheck(kingSquare) {

    const squares =
        Array.from(
            document.querySelectorAll(".square")
        );


    const kingIndex =
        squares.indexOf(kingSquare);

    if (kingIndex === -1) {
        return false;
    }


    const kingPiece =
        getPiece(kingSquare);

    const isWhiteKing =
        kingPiece === "♔";


    const enemyPieces =
        isWhiteKing
            ? ["♟","♜","♞","♝","♛"]
            : ["♙","♖","♘","♗","♕"];


    const kingRow =
        Math.floor(kingIndex / 8);

    const kingCol =
        kingIndex % 8;


    for (
        let i = 0;
        i < 64;
        i++
    ) {

        const piece =
            getPiece(squares[i]);


        if (!enemyPieces.includes(piece)) {
            continue;
        }


        const row =
            Math.floor(i / 8);

        const col =
            i % 8;


        /* PIONI */

        if (
            piece === "♙" ||
            piece === "♟"
        ) {

            const direction =
                piece === "♙" ? -1 : 1;

            if (
                row + direction === kingRow &&
                Math.abs(
                    col - kingCol
                ) === 1
            ) {
                return true;
            }
        }


        /* KALI */

        if (
            piece === "♘" ||
            piece === "♞"
        ) {

            const rd =
                Math.abs(
                    row - kingRow
                );

            const cd =
                Math.abs(
                    col - kingCol
                );

            if (
                (
                    rd === 2 &&
                    cd === 1
                ) ||
                (
                    rd === 1 &&
                    cd === 2
                )
            ) {
                return true;
            }
        }


        /* TORRA / MBRETËRESHA */

        if (
            piece === "♖" ||
            piece === "♜" ||
            piece === "♕" ||
            piece === "♛"
        ) {

            const straight =
                row === kingRow ||
                col === kingCol;

            if (straight) {

                const rowStep =
                    row === kingRow
                        ? 0
                        : (
                            kingRow > row
                                ? 1
                                : -1
                        );

                const colStep =
                    col === kingCol
                        ? 0
                        : (
                            kingCol > col
                                ? 1
                                : -1
                        );

                let r =
                    row + rowStep;

                let c =
                    col + colStep;

                let clear = true;

                while (
                    r !== kingRow ||
                    c !== kingCol
                ) {

                    if (
                        getPiece(
                            squares[r * 8 + c]
                        ) !== ""
                    ) {

                        clear = false;
                        break;
                    }

                    r += rowStep;
                    c += colStep;
                }

                if (clear) {
                    return true;
                }
            }
        }


        /* FILI / MBRETËRESHA */

        if (
            piece === "♗" ||
            piece === "♝" ||
            piece === "♕" ||
            piece === "♛"
        ) {

            const rd =
                Math.abs(
                    row - kingRow
                );

            const cd =
                Math.abs(
                    col - kingCol
                );

            if (rd === cd) {

                const rowStep =
                    kingRow > row
                        ? 1
                        : -1;

                const colStep =
                    kingCol > col
                        ? 1
                        : -1;

                let r =
                    row + rowStep;

                let c =
                    col + colStep;

                let clear = true;

                while (
                    r !== kingRow ||
                    c !== kingCol
                ) {

                    if (
                        getPiece(
                            squares[r * 8 + c]
                        ) !== ""
                    ) {

                        clear = false;
                        break;
                    }

                    r += rowStep;
                    c += colStep;
                }

                if (clear) {
                    return true;
                }
            }
        }
    }


    return false;
}
