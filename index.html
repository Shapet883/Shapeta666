<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shapeta Chess Kosova</title>

<style>

body {
    margin: 0;
    background: #222;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 20px 0;
}

#board {
    width: 520px;
    height: 520px;
    margin: 20px auto;
    display: grid;
    grid-template-columns: repeat(8, 65px);
    grid-template-rows: repeat(8, 65px);
    border: 5px solid #111;
}

.square {
    width: 65px;
    height: 65px;
    box-sizing: border-box;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 56px;
    cursor: pointer;
}

.light {
    background: #b98f58;
}

.dark {
    background: #684526;
}

.white-piece {
    color: #f5f5f5;
    text-shadow:
        3px 0 0 #000,
        -3px 0 0 #000,
        0 3px 0 #000,
        0 -3px 0 #000;
}

.black-piece {
    color: #111;
    text-shadow:
        3px 0 0 #fff,
        -3px 0 0 #fff,
        0 3px 0 #fff,
        0 -3px 0 #fff;
}

.selected {
    background: #cdd45a !important;
}

.in-check {
    background: red !important;
}

.coordinate {
    position: absolute;
    font-size: 13px;
    font-weight: bold;
    color: #222;
    pointer-events: none;
}

.file {
    bottom: 2px;
    right: 4px;
}

.rank {
    top: 2px;
    left: 4px;
}

#newGameButton {
    margin: 10px 0 30px 0;
    padding: 10px 20px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 8px;
    border: 2px solid #111;
}

@media (max-width: 600px) {

    #board {
        width: 400px;
        height: 400px;
        grid-template-columns: repeat(8, 50px);
        grid-template-rows: repeat(8, 50px);
    }

    .square {
        width: 50px;
        height: 50px;
        font-size: 42px;
    }
}

</style>
</head>

<body>

<h1>♟️ SHAPETA CHESS KOSOVA 🇽🇰</h1>

<div id="board"></div>

<button id="newGameButton">🔄 LOJA E RE</button>

<script>

const board = document.getElementById("board");

const pieces = [

    "♜","♞","♝","♛","♚","♝","♞","♜",

    "♟","♟","♟","♟","♟","♟","♟","♟",

    "","","","","","","","",

    "","","","","","","","",

    "","","","","","","","",

    "","","","","","","","",

    "♙","♙","♙","♙","♙","♙","♙","♙",

    "♖","♘","♗","♕","♔","♗","♘","♖"

];

let selectedSquare = null;
let whiteTurn = true;
let lastDoubleStep = null;

let whiteKingMoved = false;
let blackKingMoved = false;

let whiteRookLeftMoved = false;
let whiteRookRightMoved = false;

let blackRookLeftMoved = false;
let blackRookRightMoved = false;


/* KRIJO TABELËN */

for (let i = 0; i < 64; i++) {

    const square = document.createElement("div");

    square.classList.add("square");

    if (
        Math.floor(i / 8) + i % 8
        % 2 === 0
    ) {
        square.classList.add("light");
    } else {
        square.classList.add("dark");
    }

    const row = Math.floor(i / 8);
    const col = i % 8;

    if (pieces[i] !== "") {

        square.textContent = pieces[i];

        if (
            pieces[i] === "♔" ||
            pieces[i] === "♕" ||
            pieces[i] === "♖" ||
            pieces[i] === "♗" ||
            pieces[i] === "♘" ||
            pieces[i] === "♙"
        ) {
            square.classList.add("white-piece");
        } else {
            square.classList.add("black-piece");
        }
    }

    /* SHKRONJAT A-H */

    if (row === 7) {

        const file = document.createElement("span");

        file.classList.add("coordinate", "file");

        file.textContent =
            String.fromCharCode(97 + col);

        square.appendChild(file);
    }

    /* NUMRAT 8-1 */

    if (col === 0) {

        const rank = document.createElement("span");

        rank.classList.add("coordinate", "rank");

        rank.textContent = 8 - row;

        square.appendChild(rank);
    }

    square.addEventListener("click", function () {

        handleSquareClick(this, i);

    });

    board.appendChild(square);
}


/* KLIKO KATRORIN */

function handleSquareClick(square, index) {

    const squares =
        Array.from(document.querySelectorAll(".square"));

    const piece = square.textContent.replace(/[a-h1-8]/g, "");

    /* ZGJIDH FIGURËN */

    if (selectedSquare === null) {

        if (piece === "") {
            return;
        }

        const isWhitePiece =
            "♔♕♖♗♘♙".includes(piece);

        if (isWhitePiece !== whiteTurn) {
            return;
        }

        selectedSquare = index;

        square.classList.add("selected");

        return;
    }


    /* KLIKIMI PËRSËRI MBI TË NJËJTËN FIGURË */

    if (selectedSquare === index) {

        square.classList.remove("selected");

        selectedSquare = null;

        return;
    }


    const from = selectedSquare;
    const to = index;

    const fromRow = Math.floor(from / 8);
    const fromCol = from % 8;

    const toRow = Math.floor(to / 8);
    const toCol = to % 8;

    const movingSquare = squares[from];

    const targetSquare = squares[to];

    const movingPiece =
        movingSquare.textContent.replace(/[a-h1-8]/g, "");

    const target =
        targetSquare.textContent.replace(/[a-h1-8]/g, "");


    const isWhitePiece =
        "♔♕♖♗♘♙".includes(movingPiece);

    if (isWhitePiece !== whiteTurn) {
        return;
    }


    const sameColor =
        target !== "" &&
        (
            "♔♕♖♗♘♙".includes(target) === isWhitePiece
        );


    let validMove = false;


    /* PAWN */

    if (
        movingPiece === "♙" ||
        movingPiece === "♟"
    ) {

        const direction =
            movingPiece === "♙" ? -1 : 1;

        const startRow =
            movingPiece === "♙" ? 6 : 1;

        /* NJË HAP */

        if (
            toCol === fromCol &&
            toRow - fromRow === direction &&
            target === ""
        ) {
            validMove = true;
        }

        /* DY HAPA */

        if (
            toCol === fromCol &&
            fromRow === startRow &&
            toRow - fromRow === direction * 2 &&
            target === "" &&
            squares[from + direction * 8].textContent === ""
        ) {
            validMove = true;
        }

        /* KAPJE */

        if (
            Math.abs(toCol - fromCol) === 1 &&
            toRow - fromRow === direction &&
            target !== "" &&
            !sameColor
        ) {
            validMove = true;
        }

        /* EN PASSANT */

        if (
            Math.abs(toCol - fromCol) === 1 &&
            toRow - fromRow === direction &&
            target === ""
        ) {

            if (lastDoubleStep !== null) {

                const lastIndex =
                    lastDoubleStep.index;

                const lastPiece =
                    lastDoubleStep.piece;

                if (
                    lastIndex === fromCol + fromRow * 8 + (toCol - fromCol) &&
                    (
                        lastPiece === "♙" ||
                        lastPiece === "♟"
                    )
                ) {

                    validMove = true;

                    squares[lastIndex].textContent = "";

                    squares[lastIndex]
                        .classList.remove(
                            "white-piece",
                            "black-piece"
                        );
                }
            }
        }
    }


    /* KALËS */

    if (
        movingPiece === "♘" ||
        movingPiece === "♞"
    ) {

        const rowDiff =
            Math.abs(toRow - fromRow);

        const colDiff =
            Math.abs(toCol - fromCol);

        if (
            (
                rowDiff === 2 &&
                colDiff === 1
            ) ||
            (
                rowDiff === 1 &&
                colDiff === 2
            )
        ) {

            if (!sameColor) {
                validMove = true;
            }
        }
    }


    /* TORRA */

    if (
        movingPiece === "♖" ||
        movingPiece === "♜"
    ) {

        if (
            fromRow === toRow ||
            fromCol === toCol
        ) {

            let clear = true;

            const rowStep =
                toRow === fromRow
                    ? 0
                    : (toRow > fromRow ? 1 : -1);

            const colStep =
                toCol === fromCol
                    ? 0
                    : (toCol > fromCol ? 1 : -1);

            let r = fromRow + rowStep;
            let c = fromCol + colStep;

            while (
                r !== toRow ||
                c !== toCol
            ) {

                const checkIndex =
                    r * 8 + c;

                if (
                    squares[checkIndex]
                        .textContent
                        .replace(/[a-h1-8]/g, "") !== ""
                ) {

                    clear = false;
                    break;
                }

                r += rowStep;
                c += colStep;
            }

            if (clear && !sameColor) {
                validMove = true;
            }
        }
    }


    /* FILI */

    if (
        movingPiece === "♗" ||
        movingPiece === "♝"
    ) {

        const rowDiff =
            Math.abs(toRow - fromRow);

        const colDiff =
            Math.abs(toCol - fromCol);

        if (rowDiff === colDiff) {

            let clear = true;

            const rowStep =
                toRow > fromRow ? 1 : -1;

            const colStep =
                toCol > fromCol ? 1 : -1;

            let r = fromRow + rowStep;
            let c = fromCol + colStep;

            while (
                r !== toRow ||
                c !== toCol
            ) {

                const checkIndex =
                    r * 8 + c;

                if (
                    squares[checkIndex]
                        .textContent
                        .replace(/[a-h1-8]/g, "") !== ""
                ) {

                    clear = false;
                    break;
                }

                r += rowStep;
                c += colStep;
            }

            if (clear && !sameColor) {
                validMove = true;
            }
        }
    }


    /* MBRETËRESHA */

    if (
        movingPiece === "♕" ||
        movingPiece === "♛"
    ) {

        const rowDiff =
            Math.abs(toRow - fromRow);

        const colDiff =
            Math.abs(toCol - fromCol);

        const straight =
            fromRow === toRow ||
            fromCol === toCol;

        const diagonal =
            rowDiff === colDiff;

        if (straight || diagonal) {

            let clear = true;

            const rowStep =
                toRow === fromRow
                    ? 0
                    : (toRow > fromRow ? 1 : -1);

            const colStep =
                toCol === fromCol
                    ? 0
                    : (toCol > fromCol ? 1 : -1);

            let r = fromRow + rowStep;
            let c = fromCol + colStep;

            while (
                r !== toRow ||
                c !== toCol
            ) {

                const checkIndex =
                    r * 8 + c;

                if (
                    squares[checkIndex]
                        .textContent
                        .replace(/[a-h1-8]/g, "") !== ""
                ) {

                    clear = false;
                    break;
                }

                r += rowStep;
                c += colStep;
            }

            if (clear && !sameColor) {
                validMove = true;
            }
        }
    }


    /* MBRETI + ROKADA */

    if (
        movingPiece === "♔" ||
        movingPiece === "♚"
    ) {

        const rowDiff =
            Math.abs(toRow - fromRow);

        const colDiff =
            Math.abs(toCol - fromCol);


        /* LËVIZJE NORMALE */

        if (
            rowDiff <= 1 &&
            colDiff <= 1 &&
            rowDiff + colDiff > 0 &&
            !sameColor
        ) {

            validMove = true;
        }


        /* ROKADA */

        if (
            rowDiff === 0 &&
            colDiff === 2
        ) {

            /* MBRETI I BARDHË */

            if (
                movingPiece === "♔" &&
                fromRow === 7 &&
                fromCol === 4
            ) {

                /* ROKADA E SHKURTËR */

                if (
                    toCol === 6 &&
                    !whiteKingMoved &&
                    !whiteRookRightMoved &&
                    canCastle(true, true)
                ) {

                    validMove = true;
                }


                /* ROKADA E GJATË */

                if (
                    toCol === 2 &&
                    !whiteKingMoved &&
                    !whiteRookLeftMoved &&
                    canCastle(true, false)
                ) {

                    validMove = true;
                }
            }


            /* MBRETI I ZI */

            if (
                movingPiece === "♚" &&
                fromRow === 0 &&
                fromCol === 4
            ) {

                /* ROKADA E SHKURTËR */

                if (
                    toCol === 6 &&
                    !blackKingMoved &&
                    !blackRookRightMoved &&
                    canCastle(false, true)
                ) {

                    validMove = true;
                }


                /* ROKADA E GJATË */

                if (
                    toCol === 2 &&
                    !blackKingMoved &&
                    !blackRookLeftMoved &&
                    canCastle(false, false)
                ) {

                    validMove = true;
                }
            }
        }
    }


    /* NUK LEJOHET KAPJA E MBRETIT */

    if (
        target === "♔" ||
        target === "♚"
    ) {

        validMove = false;
    }


    if (!validMove) {
        return;
    }


    /* RUAJ GJENDJEN PËR KONTROLL */

    const oldFromText =
        squares[from].textContent;

    const oldToText =
        squares[to].textContent;

    const oldFromClasses =
        squares[from].className;

    const oldToClasses =
        squares[to].className;


    /* LËVIZJA E TORRES GJATË ROKADËS */

    let isCastling = false;

    if (
        (
            movingPiece === "♔" ||
            movingPiece === "♚"
        ) &&
        Math.abs(toCol - fromCol) === 2 &&
        fromRow === toRow
    ) {

        isCastling = true;


        /* BARDHI - SHKURTËR */

        if (
            movingPiece === "♔" &&
            toCol === 6
        ) {

            squares[63].textContent = "";

            squares[61].textContent = "♖";

            squares[63]
                .classList
                .remove(
                    "white-piece",
                    "black-piece"
                );

            squares[61]
                .classList
                .remove(
                    "white-piece",
                    "black-piece"
                );

            squares[61]
                .classList
                .add("white-piece");
        }


        /* BARDHI - GJATË */

        if (
            movingPiece === "♔" &&
            toCol === 2
        ) {

            squares[56].textContent = "";

            squares[59].textContent = "♖";

            squares[56]
                .classList
                .remove(
                    "white-piece",
                    "black-piece"
                );

            squares[59]
                .classList
                .remove(
                    "white-piece",
                    "black-piece"
                );

            squares[59]
                .classList
                .add("white-piece");
        }


        /* ZI - SHKURTËR */

        if (
            movingPiece === "♚" &&
            toCol === 6
        ) {

            squares[7].textContent = "";

            squares[5].textContent = "♜";

            squares[7]
                .classList
                .remove(
                    "white-piece",
                    "black-piece"
                );

            squares[5]
                .classList
                .remove(
                    "white-piece",
                    "black-piece"
                );

            squares[5]
                .classList
                .add("black-piece");
        }


        /* ZI - GJATË */

        if (
            movingPiece === "♚" &&
            toCol === 2
        ) {

            squares[0].textContent = "";

            squares[3].textContent = "♜";

            squares[0]
                .classList
                .remove(
                    "white-piece",
                    "black-piece"
                );

            squares[3]
                .classList
                .remove(
                    "white-piece",
                    "black-piece"
                );

            squares[3]
                .classList
                .add("black-piece");
        }
    }


    /* SHËNO FIGURAT QË JANË LËVIZUR */

    if (movingPiece === "♔") {
        whiteKingMoved = true;
    }

    if (movingPiece === "♚") {
        blackKingMoved = true;
    }

    if (
        movingPiece === "♖" &&
        from === 56
    ) {
        whiteRookLeftMoved = true;
    }

    if (
        movingPiece === "♖" &&
        from === 63
    ) {
        whiteRookRightMoved = true;
    }

    if (
        movingPiece === "♜" &&
        from === 0
    ) {
        blackRookLeftMoved = true;
    }

    if (
        movingPiece === "♜" &&
        from === 7
    ) {
        blackRookRightMoved = true;
    }


    /* BËJ LËVIZJEN */

    squares[from].textContent = "";

    squares[from]
        .classList
        .remove(
            "white-piece",
            "black-piece",
            "selected"
        );

    squares[to].textContent = movingPiece;

    squares[to]
        .classList
        .remove(
            "white-piece",
            "black-piece"
        );

    if (isWhitePiece) {

        squares[to]
            .classList
            .add("white-piece");

    } else {

        squares[to]
            .classList
            .add("black-piece");
    }


    /* DY HAPA I PIONIT */

    if (
        (
            movingPiece === "♙" ||
            movingPiece === "♟"
        ) &&
        Math.abs(toRow - fromRow) === 2
    ) {

        lastDoubleStep = {
            index: to,
            piece: movingPiece
        };

    } else {

        lastDoubleStep = null;
    }


    /* KONTROLLO SHAHUN E MBRETIT TË VET */

    const ownKing =
        isWhitePiece ? "♔" : "♚";

    const ownKingIndex =
        squares.findIndex(
            s =>
                s.textContent
                    .replace(/[a-h1-8]/g, "") === ownKing
        );


    if (
        ownKingIndex !== -1 &&
        isKingInCheck(squares[ownKingIndex])
    ) {

        /* KTHE LËVIZJEN MBRAPSHT */

        squares[from].textContent =
            oldFromText;

        squares[to].textContent =
            oldToText;

        squares[from].className =
            oldFromClasses;

        squares[to].className =
            oldToClasses;


        /* KTHE TORREN NË VEND GJATË ROKADËS */

        if (isCastling) {

            if (
                movingPiece === "♔" &&
                toCol === 6
            ) {

                squares[61].textContent = "";

                squares[63].textContent = "♖";

                squares[61]
                    .classList
                    .remove("white-piece");

                squares[63]
                    .classList
                    .add("white-piece");
            }

            if (
                movingPiece === "♔" &&
                toCol === 2
            ) {

                squares[59].textContent = "";

                squares[56].textContent = "♖";

                squares[59]
                    .classList
                    .remove("white-piece");

                squares[56]
                    .classList
                    .add("white-piece");
            }

            if (
                movingPiece === "♚" &&
                toCol === 6
            ) {

                squares[5].textContent = "";

                squares[7].textContent = "♜";

                squares[5]
                    .classList
                    .remove("black-piece");

                squares[7]
                    .classList
                    .add("black-piece");
            }

            if (
                movingPiece === "♚" &&
                toCol === 2
            ) {

                squares[3].textContent = "";

                squares[0].textContent = "♜";

                squares[3]
                    .classList
                    .remove("black-piece");

                squares[0]
                    .classList
                    .add("black-piece");
            }
        }

        return;
    }


    selectedSquare = null;


    /* PROMOVIMI I PIONIT */

    if (
        movingPiece === "♙" &&
        toRow === 0
    ) {

        const choice =
            prompt(
                "Promovim: q = Mbretëreshë, r = Torra, b = Fil, n = Kalë"
            );

        let newPiece = "♕";

        if (choice === "r") {
            newPiece = "♖";
        }

        if (choice === "b") {
            newPiece = "♗";
        }

        if (choice === "n") {
            newPiece = "♘";
        }

        squares[to].textContent =
            newPiece;

        squares[to]
            .classList
            .remove(
                "white-piece",
                "black-piece"
            );

        squares[to]
            .classList
            .add("white-piece");
    }


    if (
        movingPiece === "♟" &&
        toRow === 7
    ) {

        const choice =
            prompt(
                "Promovim: q = Mbretëreshë, r = Torra, b = Fil, n = Kalë"
            );

        let newPiece = "♛";

        if (choice === "r") {
            newPiece = "♜";
        }

        if (choice === "b") {
            newPiece = "♝";
        }

        if (choice === "n") {
            newPiece = "♞";
        }

        squares[to].textContent =
            newPiece;

        squares[to]
            .classList
            .remove(
                "white-piece",
                "black-piece"
            );

        squares[to]
            .classList
            .add("black-piece");
    }


    /* NDRYSHO RADHËN */

    whiteTurn = !whiteTurn;


    /* HIQ SHENJAT E SHAHUT */

    squares.forEach(s =>
        s.classList.remove("in-check")
    );


    /* KONTROLLO SHAHUN */

    const enemyKing =
        whiteTurn ? "♔" : "♚";

    const enemyKingIndex =
        squares.findIndex(
            s =>
                s.textContent
                    .replace(/[a-h1-8]/g, "") === enemyKing
        );


    if (
        enemyKingIndex !== -1 &&
        isKingInCheck(
            squares[enemyKingIndex]
        )
    ) {

        squares[enemyKingIndex]
            .classList
            .add("in-check");


        /* KONTROLLO SHAH-MATIN */

        if (isCheckmate(whiteTurn)) {

            setTimeout(() => {

                if (whiteTurn) {

                    alert(
                        "SHAH-MAT! Fiton lojtari i zi."
                    );

                } else {

                    alert(
                        "SHAH-MAT! Fiton lojtari i bardhë."
                    );
                }

            }, 800);
        }
        else {

            alert(
                "Nuk lejohet! Mbreti është në shah."
            );
        }
    }
}


/* A KA NDONJË LËVIZJE TË LEJUAR? */

function hasAnyLegalMove(isWhite) {

    const squares =
        Array.from(
            document.querySelectorAll(".square")
        );

    const ownPieces =
        isWhite
            ? ["♔","♕","♖","♗","♘","♙"]
            : ["♚","♛","♜","♝","♞","♟"];


    for (let from = 0; from < 64; from++) {

        const piece =
            squares[from]
                .textContent
                .replace(/[a-h1-8]/g, "");

        if (!ownPieces.includes(piece)) {
            continue;
        }


        /* KONTROLLO ROKADËN */

        if (
            piece ===
            (isWhite ? "♔" : "♚")
        ) {

            if (
                canCastle(isWhite, true)
            ) {
                return true;
            }

            if (
                canCastle(isWhite, false)
            ) {
                return true;
            }
        }


        for (let to = 0; to < 64; to++) {

            if (from === to) {
                continue;
            }

            const target =
                squares[to]
                    .textContent
                    .replace(/[a-h1-8]/g, "");

            if (
                target === "♔" ||
                target === "♚"
            ) {
                continue;
            }


            const fromRow =
                Math.floor(from / 8);

            const fromCol =
                from % 8;

            const toRow =
                Math.floor(to / 8);

            const toCol =
                to % 8;


            const sameColor =
                target !== "" &&
                (
                    "♔♕♖♗♘♙"
                    .includes(target)
                    ===
                    isWhite
                );


            if (sameColor) {
                continue;
            }


            let valid = false;


            /* PAWN */

            if (
                piece === "♙" ||
                piece === "♟"
            ) {

                const direction =
                    piece === "♙" ? -1 : 1;

                const startRow =
                    piece === "♙" ? 6 : 1;


                if (
                    toCol === fromCol &&
                    toRow - fromRow === direction &&
                    target === ""
                ) {
                    valid = true;
                }


                if (
                    toCol === fromCol &&
                    fromRow === startRow &&
                    toRow - fromRow === direction * 2 &&
                    target === "" &&
                    squares[
                        from + direction * 8
                    ]
                    .textContent
                    .replace(/[a-h1-8]/g, "") === ""
                ) {
                    valid = true;
                }


                if (
                    Math.abs(
                        toCol - fromCol
                    ) === 1 &&
                    toRow - fromRow === direction &&
                    target !== ""
                ) {
                    valid = true;
                }
            }


            /* KALËS */

            if (
                piece === "♘" ||
                piece === "♞"
            ) {

                const rd =
                    Math.abs(
                        toRow - fromRow
                    );

                const cd =
                    Math.abs(
                        toCol - fromCol
                    );

                if (
                    (
                        rd === 2 &&
                        cd === 1
                    ) ||
                    (
                        rd === 1 &&
                        cd === 2
                    )
                ) {
                    valid = true;
                }
            }


            /* TORRA */

            if (
                piece === "♖" ||
                piece === "♜"
            ) {

                if (
                    fromRow === toRow ||
                    fromCol === toCol
                ) {

                    let clear = true;

                    const rowStep =
                        toRow === fromRow
                            ? 0
                            : (toRow > fromRow ? 1 : -1);

                    const colStep =
                        toCol === fromCol
                            ? 0
                            : (toCol > fromCol ? 1 : -1);

                    let r =
                        fromRow + rowStep;

                    let c =
                        fromCol + colStep;

                    while (
                        r !== toRow ||
                        c !== toCol
                    ) {

                        if (
                            squares[
                                r * 8 + c
                            ]
                            .textContent
                            .replace(/[a-h1-8]/g, "") !== ""
                        ) {

                            clear = false;
                            break;
                        }

                        r += rowStep;
                        c += colStep;
                    }

                    if (clear) {
                        valid = true;
                    }
                }
            }


            /* FILI */

            if (
                piece === "♗" ||
                piece === "♝"
            ) {

                const rd =
                    Math.abs(
                        toRow - fromRow
                    );

                const cd =
                    Math.abs(
                        toCol - fromCol
                    );

                if (rd === cd) {

                    let clear = true;

                    const rowStep =
                        toRow > fromRow ? 1 : -1;

                    const colStep =
                        toCol > fromCol ? 1 : -1;

                    let r =
                        fromRow + rowStep;

                    let c =
                        fromCol + colStep;

                    while (
                        r !== toRow ||
                        c !== toCol
                    ) {

                        if (
                            squares[
                                r * 8 + c
                            ]
                            .textContent
                            .replace(/[a-h1-8]/g, "") !== ""
                        ) {

                            clear = false;
                            break;
                        }

                        r += rowStep;
                        c += colStep;
                    }

                    if (clear) {
                        valid = true;
                    }
                }
            }


            /* MBRETËRESHA */

            if (
                piece === "♕" ||
                piece === "♛"
            ) {

                const rd =
                    Math.abs(
                        toRow - fromRow
                    );

                const cd =
                    Math.abs(
                        toCol - fromCol
                    );

                const straight =
                    fromRow === toRow ||
                    fromCol === toCol;

                const diagonal =
                    rd === cd;

                if (straight || diagonal) {

                    let clear = true;

                    const rowStep =
                        toRow === fromRow
                            ? 0
                            : (toRow > fromRow ? 1 : -1);

                    const colStep =
                        toCol === fromCol
                            ? 0
                            : (toCol > fromCol ? 1 : -1);

                    let r =
                        fromRow + rowStep;

                    let c =
                        fromCol + colStep;

                    while (
                        r !== toRow ||
                        c !== toCol
                    ) {

                        if (
                            squares[
                                r * 8 + c
                            ]
                            .textContent
                            .replace(/[a-h1-8]/g, "") !== ""
                        ) {

                            clear = false;
                            break;
                        }

                        r += rowStep;
                        c += colStep;
                    }

                    if (clear) {
                        valid = true;
                    }
                }
            }


            /* MBRETI */

            if (
                piece === "♔" ||
                piece === "♚"
            ) {

                const rd =
                    Math.abs(
                        toRow - fromRow
                    );

                const cd =
                    Math.abs(
                        toCol - fromCol
                    );

                if (
                    rd <= 1 &&
                    cd <= 1 &&
                    rd + cd > 0
                ) {
                    valid = true;
                }
            }


            if (!valid) {
                continue;
            }


            /* PROVO LËVIZJEN */

            const oldFrom =
                squares[from].textContent;

            const oldTo =
                squares[to].textContent;

            squares[from].textContent = "";

            squares[to].textContent = piece;


            const kingPiece =
                isWhite ? "♔" : "♚";

            const kingIndex =
                squares.findIndex(
                    s =>
                        s.textContent
                            .replace(/[a-h1-8]/g, "") ===
                        kingPiece
                );


            const leavesKingInCheck =
                kingIndex !== -1 &&
                isKingInCheck(
                    squares[kingIndex]
                );


            squares[from].textContent =
                oldFrom;

            squares[to].textContent =
                oldTo;


            if (!leavesKingInCheck) {
                return true;
            }
        }
    }

    return false;
}


/* SHAH-MAT */

function isCheckmate(isWhite) {

    const squares =
        Array.from(
            document.querySelectorAll(".square")
        );

    const kingPiece =
        isWhite ? "♔" : "♚";

    const kingSquare =
        squares.find(
            s =>
                s.textContent
                    .replace(/[a-h1-8]/g, "") ===
                kingPiece
        );


    if (!kingSquare) {
        return false;
    }


    if (!isKingInCheck(kingSquare)) {
        return false;
    }


    return !hasAnyLegalMove(isWhite);
}


/* ROKADA */

function canCastle(
    isWhite,
    shortCastle
) {

    const squares =
        Array.from(
            document.querySelectorAll(".square")
        );


    const kingIndex =
        isWhite ? 60 : 4;


    const rookIndex =
        isWhite
            ? (
                shortCastle
                    ? 63
                    : 56
            )
            : (
                shortCastle
                    ? 7
                    : 0
            );


    const emptySquares =
        isWhite
            ? (
                shortCastle
                    ? [61, 62]
                    : [57, 58, 59]
            )
            : (
                shortCastle
                    ? [5, 6]
                    : [1, 2, 3]
            );


    const kingPiece =
        isWhite ? "♔" : "♚";

    const rookPiece =
        isWhite ? "♖" : "♜";


    if (
        squares[kingIndex]
            .textContent !== kingPiece
    ) {
        return false;
    }


    if (
        squares[rookIndex]
            .textContent !== rookPiece
    ) {
        return false;
    }


    for (
        const index of emptySquares
    ) {

        if (
            squares[index]
                .textContent
                .replace(/[a-h1-8]/g, "") !== ""
        ) {
            return false;
        }
    }


    /* MBRETI NUK GUZON TË JETË NË SHAH */

    if (
        isKingInCheck(
            squares[kingIndex]
        )
    ) {
        return false;
    }


    const middleIndex =
        shortCastle
            ? (
                isWhite ? 61 : 5
            )
            : (
                isWhite ? 59 : 3
            );


    const destinationIndex =
        shortCastle
            ? (
                isWhite ? 62 : 6
            )
            : (
                isWhite ? 58 : 2
            );


    /* KONTROLLI I KATRORIT TË MESËM */

    const oldKingText =
        squares[kingIndex].textContent;

    squares[kingIndex].textContent = "";

    squares[middleIndex].textContent =
        kingPiece;


    const middleInCheck =
        isKingInCheck(
            squares[middleIndex]
        );


    squares[middleIndex].textContent = "";

    squares[kingIndex].textContent =
        oldKingText;


    if (middleInCheck) {
        return false;
    }


    /* KONTROLLI I KATRORIT TË FUNDIT */

    squares[kingIndex].textContent = "";

    squares[destinationIndex].textContent =
        kingPiece;


    const destinationInCheck =
        isKingInCheck(
            squares[destinationIndex]
        );


    squares[destinationIndex].textContent = "";

    squares[kingIndex].textContent =
        oldKingText;


    if (destinationInCheck) {
        return false;
    }


    return true;
}


/* KONTROLLO SHAHUN */

function isKingInCheck(kingSquare) {

    const squares =
        Array.from(
            document.querySelectorAll(".square")
        );


    const kingIndex =
        squares.indexOf(kingSquare);

    if (kingIndex === -1) {
        return false;
    }


    const kingPiece =
        kingSquare
            .textContent
            .replace(/[a-h1-8]/g, "");


    const isWhiteKing =
        kingPiece === "♔";


    const enemyPieces =
        isWhiteKing
            ? ["♟","♜","♞","♝","♛"]
            : ["♙","♖","♘","♗","♕"];


    const kingRow =
        Math.floor(kingIndex / 8);

    const kingCol =
        kingIndex % 8;


    /* KONTROLLO TË GJITHA FIGURAT E ARMIKUT */

    for (
        let i = 0;
        i < 64;
        i++
    ) {

        const piece =
            squares[i]
                .textContent
                .replace(/[a-h1-8]/g, "");


        if (!enemyPieces.includes(piece)) {
            continue;
        }


        const row =
            Math.floor(i / 8);

        const col =
            i % 8;


        /* PIONI */

        if (
            piece === "♙" ||
            piece === "♟"
        ) {

            const direction =
                piece === "♙" ? -1 : 1;

            if (
                row + direction === kingRow &&
                Math.abs(col - kingCol) === 1
            ) {
                return true;
            }
        }


        /* KALËS */

        if (
            piece === "♘" ||
            piece === "♞"
        ) {

            const rd =
                Math.abs(
                    row - kingRow
                );

            const cd =
                Math.abs(
                    col - kingCol
                );

            if (
                (
                    rd === 2 &&
                    cd === 1
                ) ||
                (
                    rd === 1 &&
                    cd === 2
                )
            ) {
                return true;
            }
        }


        /* TORRA / MBRETËRESHA */

        if (
            piece === "♖" ||
            piece === "♜" ||
            piece === "♕" ||
            piece === "♛"
        ) {

            const straight =
                row === kingRow ||
                col === kingCol;

            if (straight) {

                let rowStep =
                    row === kingRow
                        ? 0
                        : (
                            kingRow > row
                                ? 1
                                : -1
                        );

                let colStep =
                    col === kingCol
                        ? 0
                        : (
                            kingCol > col
                                ? 1
                                : -1
                        );


                let r =
                    row + rowStep;

                let c =
                    col + colStep;


                let clear = true;


                while (
                    r !== kingRow ||
                    c !== kingCol
                ) {

                    if (
                        squares[
                            r * 8 + c
                        ]
                        .textContent
                        .replace(/[a-h1-8]/g, "") !== ""
                    ) {

                        clear = false;
                        break;
                    }

                    r += rowStep;
                    c += colStep;
                }


                if (clear) {

                    if (
                        piece === "♖" ||
                        piece === "♜"
                    ) {
                        return true;
                    }

                    if (
                        piece === "♕" ||
                        piece === "♛"
                    ) {
                        return true;
                    }
                }
            }
        }


        /* FILI / MBRETËRESHA */

        if (
            piece === "♗" ||
            piece === "♝" ||
            piece === "♕" ||
            piece === "♛"
        ) {

            const rd =
                Math.abs(
                    row - kingRow
                );

            const cd =
                Math.abs(
                    col - kingCol
                );


            if (rd === cd) {

                const rowStep =
                    kingRow > row ? 1 : -1;

                const colStep =
                    kingCol > col ? 1 : -1;


                let r =
                    row + rowStep;

                let c =
                    col + colStep;


                let clear = true;


                while (
                    r !== kingRow ||
                    c !== kingCol
                ) {

                    if (
                        squares[
                            r * 8 + c
                        ]
                        .textContent
                        .replace(/[a-h1-8]/g, "") !== ""
                    ) {

                        clear = false;
                        break;
                    }

                    r += rowStep;
                    c += colStep;
                }


                if (clear) {
                    return true;
                }
            }
        }
    }


    return false;
}


/* LOJA E RE */

document.getElementById(
    "newGameButton"
).addEventListener(
    "click",
    function () {

        const squares =
            Array.from(
                document.querySelectorAll(".square")
            );


        for (
            let i = 0;
            i < 64;
            i++
        ) {

            squares[i].textContent =
                pieces[i];

            squares[i]
                .classList
                .remove(
                    "white-piece",
                    "black-piece",
                    "selected",
                    "in-check"
                );


            if (
                pieces[i] === "♔" ||
                pieces[i] === "♕" ||
                pieces[i] === "♖" ||
                pieces[i] === "♗" ||
                pieces[i] === "♘" ||
                pieces[i] === "♙"
            ) {

                squares[i]
                    .classList
                    .add("white-piece");

            }
            else if (
                pieces[i] !== ""
            ) {

                squares[i]
                    .classList
                    .add("black-piece");
            }


            /* RIVENDOS KOORDINATAT */

            const row =
                Math.floor(i / 8);

            const col =
                i % 8;


            if (row === 7) {

                const file =
                    document.createElement("span");

                file.classList.add(
                    "coordinate",
                    "file"
                );

                file.textContent =
                    String.fromCharCode(
                        97 + col
                    );

                squares[i]
                    .appendChild(file);
            }


            if (col === 0) {

                const rank =
                    document.createElement("span");

                rank.classList.add(
                    "coordinate",
                    "rank"
                );

                rank.textContent =
                    8 - row;

                squares[i]
                    .appendChild(rank);
            }
        }


        selectedSquare = null;

        whiteTurn = true;

        lastDoubleStep = null;


        whiteKingMoved = false;
        blackKingMoved = false;

        whiteRookLeftMoved = false;
        whiteRookRightMoved = false;

        blackRookLeftMoved = false;
        blackRookRightMoved = false;
    }
);

</script>
