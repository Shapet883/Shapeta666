<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shapeta Chess Kosova</title>

<style>

body {
margin: 0;
background: #222;
color: white;

font-family: Arial, sans-serif;
text-align: center;
}

h1 {
    margin: 20px 0;
}

#board {
    width: 480px;
    height: 480px;
    margin: 20px auto;
    display: grid;
    grid-template-columns: repeat(8, 60px);
    grid-template-rows: repeat(8, 60px);
    border: 4px solid #111;
}

.square {
    width: 60px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    box-sizing: border-box;
}

.light {
    background: #d8c09a;
}

.dark {
    background: #705735;
}
.selected {
    
    box-shadow: 0 0 0 3px #888 inset;
}
</style>
</head>

<body>

<h1>♟️ SHAPETA CHESS KOSOVA 🇽🇰</h1>

<div id="board"></div>

<script>

const board = document.getElementById("board");

const pieces = [
    ["♜","♞","♝","♛","♚","♝","♞","♜"],
    ["♟","♟","♟","♟","♟","♟","♟","♟"],
    ["","","","","","","",""],
    ["","","","","","","",""],
    ["","","","","","","",""],
    ["","","","","","","",""],
    ["♙","♙","♙","♙","♙","♙","♙","♙"],
    ["♖","♘","♗","♕","♔","♗","♘","♖"]
];

for (let row = 0; row < 8; row++) {

    for (let col = 0; col < 8; col++) {

        const square = document.createElement("div");

        square.classList.add("square");

        if ((row + col) % 2 === 0) {
            square.classList.add("light");
        } else {
            square.classList.add("dark");
        }

        square.textContent = pieces[row][col];

        board.appendChild(square);
    }
}
let selectedSquare = null;
let whiteTurn = true;
let lastDoubleStep = null;
document.querySelectorAll(".square").forEach(function(square) {

square.addEventListener("click", function() {

const squares = Array.from(document.querySelectorAll(".square"));

if (selectedSquare === null) {

if (
    (whiteTurn &&
        ["♙", "♘", "♖", "♗", "♕", "♔"].includes(this.textContent)) ||
    (!whiteTurn &&
        ["♟", "♞", "♜", "♝", "♛", "♚"].includes(this.textContent))
) {
    selectedSquare = this;
    this.classList.add("selected");
}

return;
}

        const from = squares.indexOf(selectedSquare);
        const to = squares.indexOf(this);

        const fromRow = Math.floor(from / 8);
        const fromCol = from % 8;

        const toRow = Math.floor(to / 8);
        const toCol = to % 8;

        const piece = selectedSquare.textContent;

        let validMove = false;

        // USHTARI I BARDHË
if (piece === "♙") {

    // 1 katror përpara
    if (
        toCol === fromCol &&
        toRow === fromRow - 1 &&
        this.textContent === ""
    ) {
        validMove = true;
    }

    // 2 katrorë nga pozita fillestare
    if (
        fromRow === 6 &&
        toCol === fromCol &&
        toRow === fromRow - 2 &&
        this.textContent === "" &&
        squares[from - 8].textContent === ""
    ) {
        validMove = true;
    }

    // Marrje normale diagonale
if (
    toRow === fromRow - 1 &&
    Math.abs(toCol - fromCol) === 1 &&
    ["♟", "♞", "♝", "♜", "♛", "♚"].includes(this.textContent)
) {
    validMove = true;
}

    // EN PASSANT
    if (
        lastDoubleStep &&
        this.textContent === "" &&
        Math.abs(toCol - fromCol) === 1 &&
        toRow === fromRow - 1 &&
        lastDoubleStep === squares[from + (toCol - fromCol)] &&
        lastDoubleStep.textContent === "♟"
    ) {
        validMove = true;
    }
}
    
// USHTARI I ZI
if (piece === "♟") {

    // 1 katror përpara
    if (
        toCol === fromCol &&
        toRow === fromRow + 1 &&
        this.textContent === ""
    ) {
        validMove = true;
    }

    // 2 katrorë nga fillimi
    if (
        fromRow === 1 &&
        toCol === fromCol &&
        toRow === fromRow + 2 &&
        this.textContent === "" &&
        squares[from + 8].textContent === ""
    ) {
        validMove = true;
    }

    // Marrje normale diagonale
if (
    toRow === fromRow + 1 &&
    Math.abs(toCol - fromCol) === 1 &&
    ["♙", "♘", "♗", "♖", "♕", "♔"].includes(this.textContent)
) {
    validMove = true;
}

    // EN PASSANT
    if (
        lastDoubleStep &&
        this.textContent === "" &&
        Math.abs(toCol - fromCol) === 1 &&
        toRow === fromRow + 1 &&
        lastDoubleStep === squares[from + (toCol - fromCol)] &&
        lastDoubleStep.textContent === "♙"
    ) {
        validMove = true;
    }
}

// KALI I BARDHË DHE I ZI
if (piece === "♘" || piece === "♞") {

    const rowDiff = Math.abs(toRow - fromRow);
    const colDiff = Math.abs(toCol - fromCol);

    const target = this.textContent;

    const sameColor =
        (piece === "♘" &&
            ["♙", "♘", "♗", "♕", "♔"].includes(target)) ||
        (piece === "♞" &&
            ["♟", "♞", "♝", "♛", "♚"].includes(target));

    if (
        (
            (rowDiff === 2 && colDiff === 1) ||
            (rowDiff === 1 && colDiff === 2)
        ) &&
        !sameColor
    ) {
        validMove = true;
    }
}
// TORRA E BARDHË DHE E ZI
if (piece === "♖" || piece === "♜") {

    // Lëvizje horizontale ose vertikale
    if (
        (toRow === fromRow && toCol !== fromCol) ||
        (toCol === fromCol && toRow !== fromRow)
    ) {

        let blocked = false;

        // Kontrollo katrorët ndërmjet
        const rowStep =
            toRow === fromRow ? 0 :
            (toRow > fromRow ? 1 : -1);

        const colStep =
            toCol === fromCol ? 0 :
            (toCol > fromCol ? 1 : -1);

        let r = fromRow + rowStep;
        let c = fromCol + colStep;

        while (r !== toRow || c !== toCol) {

            const middleSquare = squares[r * 8 + c];

            if (middleSquare.textContent !== "") {
                blocked = true;
                break;
            }

            r += rowStep;
            c += colStep;
        }

        // Kontrollo që mos të kapë figurën e vet
        const target = this.textContent;

        const sameColor =
            (piece === "♖" &&
                ["♙", "♘", "♗", "♕", "♔", "♖"].includes(target)) ||
            (piece === "♜" &&
                ["♟", "♞", "♝", "♛", "♚", "♜"].includes(target));

        if (!blocked && !sameColor) {
            validMove = true;
        }
    }
}
// FILI I BARDHË DHE I ZI
if (piece === "♗" || piece === "♝") {

    const rowDiff = Math.abs(toRow - fromRow);
    const colDiff = Math.abs(toCol - fromCol);

    // Fili lëviz vetëm në diagonale
    if (rowDiff === colDiff && rowDiff !== 0) {

        let blocked = false;

        const rowStep = toRow > fromRow ? 1 : -1;
        const colStep = toCol > fromCol ? 1 : -1;

        let r = fromRow + rowStep;
        let c = fromCol + colStep;

        // Kontrollo katrorët ndërmjet
        while (r !== toRow && c !== toCol) {

            const middleSquare = squares[r * 8 + c];

            if (middleSquare.textContent !== "") {
                blocked = true;
                break;
            }

            r += rowStep;
            c += colStep;
        }

        // Mos lejo kapjen e figurës së vet
        const target = this.textContent;

        const sameColor =
            (piece === "♗" &&
                ["♙", "♘", "♗", "♖", "♕", "♔"].includes(target)) ||
            (piece === "♝" &&
                ["♟", "♞", "♝", "♜", "♛", "♚"].includes(target));

        if (!blocked && !sameColor) {
            validMove = true;
        }
    }
}
// MBRETËRESHA E BARDHË DHE E ZI
if (piece === "♕" || piece === "♛") {

    const rowDiff = Math.abs(toRow - fromRow);
    const colDiff = Math.abs(toCol - fromCol);

    const straight =
        (toRow === fromRow && toCol !== fromCol) ||
        (toCol === fromCol && toRow !== fromRow);

    const diagonal =
        rowDiff === colDiff && rowDiff !== 0;

    if (straight || diagonal) {

        let blocked = false;

        const rowStep =
            toRow === fromRow ? 0 :
            (toRow > fromRow ? 1 : -1);

        const colStep =
            toCol === fromCol ? 0 :
            (toCol > fromCol ? 1 : -1);

        let r = fromRow + rowStep;
        let c = fromCol + colStep;

        while (r !== toRow || c !== toCol) {

            const middleSquare = squares[r * 8 + c];

            if (middleSquare.textContent !== "") {
                blocked = true;
                break;
            }

            r += rowStep;
            c += colStep;
        }

        const target = this.textContent;

        const sameColor =
            (piece === "♕" &&
                ["♙", "♘", "♗", "♖", "♕", "♔"].includes(target)) ||
            (piece === "♛" &&
                ["♟", "♞", "♝", "♜", "♛", "♚"].includes(target));

        if (!blocked && !sameColor) {
            validMove = true;
        }
    }
}
// MBRETI I BARDHË DHE I ZI
if (piece === "♔" || piece === "♚") {

    const rowDiff = Math.abs(toRow - fromRow);
    const colDiff = Math.abs(toCol - fromCol);

    // Mbreti lëviz vetëm një katror
    if (
        rowDiff <= 1 &&
        colDiff <= 1 &&
        (rowDiff + colDiff) > 0
    ) {

        const target = this.textContent;

        const sameColor =
            (piece === "♔" &&
                ["♙", "♘", "♗", "♖", "♕", "♔"].includes(target)) ||
            (piece === "♚" &&
                ["♟", "♞", "♝", "♜", "♛", "♚"].includes(target));

        if (!sameColor) {
            validMove = true;
        }
    }
}
if (
    (piece !== "♔" && piece !== "♚") &&
    (this.textContent === "♔" || this.textContent === "♚")
) {
    validMove = false;
}
// LËVIZJA
if (validMove) {

    // Kontrollo nëse është EN PASSANT
    const isEnPassant =
        lastDoubleStep &&
        this.textContent === "" &&
        Math.abs(toCol - fromCol) === 1 &&
        (
            (piece === "♙" && toRow === fromRow - 1) ||
            (piece === "♟" && toRow === fromRow + 1)
        ) &&
        lastDoubleStep === squares[from + (toCol - fromCol)];

    // Nëse është En Passant, hiq ushtarin e kapur
    if (isEnPassant) {
        lastDoubleStep.textContent = "";
    }

    this.textContent = piece;
    selectedSquare.textContent = "";

    // Ruaj vetëm lëvizjen e fundit me 2 katrorë
    if (
        (piece === "♙" && fromRow === 6 && toRow === 4) ||
        (piece === "♟" && fromRow === 1 && toRow === 3)
    ) {
        lastDoubleStep = this;
    } else {
        lastDoubleStep = null;
    }

    whiteTurn = !whiteTurn;
}

selectedSquare.classList.remove("selected");
selectedSquare = null;

    });

});


</script>

</body>
</html>
