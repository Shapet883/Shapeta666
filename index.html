<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shapeta Chess Kosova</title>

<style>

body {
margin: 0;
background: #222;
color: white;

font-family: Arial, sans-serif;
text-align: center;
}

h1 {
    margin: 20px 0;
}

#board {
    width: 480px;
    height: 480px;
    margin: 20px auto;
    display: grid;
    grid-template-columns: repeat(8, 60px);
    grid-template-rows: repeat(8, 60px);
    border: 4px solid #111;
}

.square {
    width: 60px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    box-sizing: border-box;
}

.light {
    background: #d8c09a;
}

.dark {
    background: #705735;
}
.selected {
    
    box-shadow: 0 0 0 3px #888 inset;
}
</style>
</head>

<body>

<h1>♟️ SHAPETA CHESS KOSOVA 🇽🇰</h1>

<div id="board"></div>

<script>

const board = document.getElementById("board");

const pieces = [
    ["♜","♞","♝","♛","♚","♝","♞","♜"],
    ["♟","♟","♟","♟","♟","♟","♟","♟"],
    ["","","","","","","",""],
    ["","","","","","","",""],
    ["","","","","","","",""],
    ["","","","","","","",""],
    ["♙","♙","♙","♙","♙","♙","♙","♙"],
    ["♖","♘","♗","♕","♔","♗","♘","♖"]
];

for (let row = 0; row < 8; row++) {

    for (let col = 0; col < 8; col++) {

        const square = document.createElement("div");

        square.classList.add("square");

        if ((row + col) % 2 === 0) {
            square.classList.add("light");
        } else {
            square.classList.add("dark");
        }

        square.textContent = pieces[row][col];

        board.appendChild(square);
    }
}
let selectedSquare = null;
let whiteTurn = true;
let lastDoubleStep = null;
document.querySelectorAll(".square").forEach(function(square) {

square.addEventListener("click", function() {

const squares = Array.from(document.querySelectorAll(".square"));

if (selectedSquare === null) {

if (
    (whiteTurn &&
        ["♙", "♘"].includes(this.textContent)) ||
    (!whiteTurn &&
        ["♟", "♞"].includes(this.textContent))
) {
    selectedSquare = this;
    this.classList.add("selected");
}

return;
}

        const from = squares.indexOf(selectedSquare);
        const to = squares.indexOf(this);

        const fromRow = Math.floor(from / 8);
        const fromCol = from % 8;

        const toRow = Math.floor(to / 8);
        const toCol = to % 8;

        const piece = selectedSquare.textContent;

        let validMove = false;

        // USHTARI I BARDHË
if (piece === "♙") {

    // 1 katror përpara
    if (
        toCol === fromCol &&
        toRow === fromRow - 1 &&
        this.textContent === ""
    ) {
        validMove = true;
    }

    // 2 katrorë nga pozita fillestare
    if (
        fromRow === 6 &&
        toCol === fromCol &&
        toRow === fromRow - 2 &&
        this.textContent === "" &&
        squares[from - 8].textContent === ""
    ) {
        validMove = true;
    }

    // Marrje normale diagonale
    if (
        toRow === fromRow - 1 &&
        Math.abs(toCol - fromCol) === 1 &&
        this.textContent === "♟"
    ) {
        validMove = true;
    }

    // EN PASSANT
    if (
        lastDoubleStep &&
        this.textContent === "" &&
        Math.abs(toCol - fromCol) === 1 &&
        toRow === fromRow - 1 &&
        lastDoubleStep === squares[from + (toCol - fromCol)] &&
        lastDoubleStep.textContent === "♟"
    ) {
        validMove = true;
    }
}
    
// USHTARI I ZI
if (piece === "♟") {

    // 1 katror përpara
    if (
        toCol === fromCol &&
        toRow === fromRow + 1 &&
        this.textContent === ""
    ) {
        validMove = true;
    }

    // 2 katrorë nga fillimi
    if (
        fromRow === 1 &&
        toCol === fromCol &&
        toRow === fromRow + 2 &&
        this.textContent === "" &&
        squares[from + 8].textContent === ""
    ) {
        validMove = true;
    }

    // Marrje normale diagonale
    if (
        toRow === fromRow + 1 &&
        Math.abs(toCol - fromCol) === 1 &&
        this.textContent === "♙"
    ) {
        validMove = true;
    }

    // EN PASSANT
    if (
        lastDoubleStep &&
        this.textContent === "" &&
        Math.abs(toCol - fromCol) === 1 &&
        toRow === fromRow + 1 &&
        lastDoubleStep === squares[from + (toCol - fromCol)] &&
        lastDoubleStep.textContent === "♙"
    ) {
        validMove = true;
    }
}

// KALI I BARDHË DHE I ZI
if (piece === "♘" || piece === "♞") {

    const rowDiff = Math.abs(toRow - fromRow);
    const colDiff = Math.abs(toCol - fromCol);

    if (
        (rowDiff === 2 && colDiff === 1) ||
        (rowDiff === 1 && colDiff === 2)
    ) {
        validMove = true;
    }
}
// LËVIZJA
if (validMove) {

    // Kontrollo nëse është EN PASSANT
    const isEnPassant =
        lastDoubleStep &&
        this.textContent === "" &&
        Math.abs(toCol - fromCol) === 1 &&
        (
            (piece === "♙" && toRow === fromRow - 1) ||
            (piece === "♟" && toRow === fromRow + 1)
        ) &&
        lastDoubleStep === squares[from + (toCol - fromCol)];

    // Nëse është En Passant, hiq ushtarin e kapur
    if (isEnPassant) {
        lastDoubleStep.textContent = "";
    }

    this.textContent = piece;
    selectedSquare.textContent = "";

    // Ruaj vetëm lëvizjen e fundit me 2 katrorë
    if (
        (piece === "♙" && fromRow === 6 && toRow === 4) ||
        (piece === "♟" && fromRow === 1 && toRow === 3)
    ) {
        lastDoubleStep = this;
    } else {
        lastDoubleStep = null;
    }

    whiteTurn = !whiteTurn;
}

selectedSquare.classList.remove("selected");
selectedSquare = null;

    });

});


</script>

</body>
</html>
