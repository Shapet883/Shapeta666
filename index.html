<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shapeta Chess Kosova</title>

<style>

body {
    margin: 0;
    background: #222;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 20px 0;
}

/* TABELA E SHAHUT */
#board {
    width: 520px;
    height: 520px;
    margin: 20px auto;
    display: grid;
    grid-template-columns: repeat(8, 65px);
    grid-template-rows: repeat(8, 65px);
    border: 5px solid #111;
    box-sizing: border-box;
}

/* KATRORËT */
.square {
    width: 65px;
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
    box-sizing: border-box;
    cursor: pointer;
    position: relative;
    font-family: "DejaVu Sans", "Arial Unicode MS", sans-serif;
    font-weight: bold;
}

/* FIGURAT E BARDHA */
.white-piece {
    color: #f5f5f5;
    text-shadow:
        3px 0 0 #000,
        -3px 0 0 #000,
        0 3px 0 #000,
        0 -3px 0 #000;
}

/* FIGURAT E ZEZA */
.black-piece {
    color: #111;
    text-shadow:
        3px 0 0 #f5f5f5,
        -3px 0 0 #f5f5f5,
        0 3px 0 #f5f5f5,
        0 -3px 0 #f5f5f5;
}
/* NGJYRAT E TABELËS */
.light {
    background: #b98f58;
}

.dark {
    background: #684526;
}

/* KATRORI I ZGJEDHUR */
.selected {
    background: #cdd45a !important;
    box-shadow: none;
}

/* SHAH */
.in-check {
    background: red !important;
}

/* NUMRAT 8 - 1 */
.square:nth-child(8)::before  { content: "8"; }
.square:nth-child(16)::before { content: "7"; }
.square:nth-child(24)::before { content: "6"; }
.square:nth-child(32)::before { content: "5"; }
.square:nth-child(40)::before { content: "4"; }
.square:nth-child(48)::before { content: "3"; }
.square:nth-child(56)::before { content: "2"; }
.square:nth-child(64)::before { content: "1"; }

/* SHKRONJAT a - h */
.square:nth-child(57)::after { content: "a"; }
.square:nth-child(58)::after { content: "b"; }
.square:nth-child(59)::after { content: "c"; }
.square:nth-child(60)::after { content: "d"; }
.square:nth-child(61)::after { content: "e"; }
.square:nth-child(62)::after { content: "f"; }
.square:nth-child(63)::after { content: "g"; }
.square:nth-child(64)::after { content: "h"; }

/* PAMJA E KOORDINATAVE */
.square:nth-child(8)::before,
.square:nth-child(16)::before,
.square:nth-child(24)::before,
.square:nth-child(32)::before,
.square:nth-child(40)::before,
.square:nth-child(48)::before,
.square:nth-child(56)::before,
.square:nth-child(64)::before {
    position: absolute;
    right: 3px;
    top: 0;
    font-size: 25px;
    font-weight: bold;
    color: #f7ead0;
    text-shadow: none;
}

.square:nth-child(57)::after,
.square:nth-child(58)::after,
.square:nth-child(59)::after,
.square:nth-child(60)::after,
.square:nth-child(61)::after,
.square:nth-child(62)::after,
.square:nth-child(63)::after,
.square:nth-child(64)::after {
    position: absolute;
    left: 4px;
    bottom: 0;
    font-size: 25px;
    font-weight: bold;
    color: #f7ead0;
    text-shadow: none;
}

</style>
</head>

<body>

<h1>♟️ SHAPETA CHESS KOSOVA 🇽🇰</h1>

<div id="board"></div>

<script>

const board = document.getElementById("board");

const pieces = [
    ["♜","♞","♝","♛","♚","♝","♞","♜"],
    ["♟","♟","♟","♟","♟","♟","♟","♟"],
    ["","","","","","","",""],
    ["","","","","","","",""],
    ["","","","","","","",""],
    ["","","","","","","",""],
    ["♙","♙","♙","♙","♙","♙","♙","♙"],
    ["♖","♘","♗","♕","♔","♗","♘","♖"]
];

for (let row = 0; row < 8; row++) {

    for (let col = 0; col < 8; col++) {

        const square = document.createElement("div");

        square.classList.add("square");

        if ((row + col) % 2 === 0) {
            square.classList.add("light");
        } else {
            square.classList.add("dark");
        }

        square.textContent = pieces[row][col];

if (["♙","♘","♖","♗","♕","♔"].includes(pieces[row][col])) {
    square.classList.add("white-piece");
}

if (["♟","♞","♜","♝","♛","♚"].includes(pieces[row][col])) {
    square.classList.add("black-piece");
}

board.appendChild(square);  
    }
}

let selectedSquare = null;
let whiteTurn = true;
let lastDoubleStep = null;

document.querySelectorAll(".square").forEach(function(square) {

    square.addEventListener("click", function() {

        const squares = Array.from(document.querySelectorAll(".square"));

        if (selectedSquare === null) {

            if (
                (whiteTurn &&
                    ["♙","♘","♖","♗","♕","♔"].includes(this.textContent)) ||
                (!whiteTurn &&
                    ["♟","♞","♜","♝","♛","♚"].includes(this.textContent))
            ) {

                selectedSquare = this;
                this.classList.add("selected");
            }

            return;
        }

        const from = squares.indexOf(selectedSquare);
        const to = squares.indexOf(this);

        const fromRow = Math.floor(from / 8);
        const fromCol = from % 8;

        const toRow = Math.floor(to / 8);
        const toCol = to % 8;

        const piece = selectedSquare.textContent;
        const target = this.textContent;

        let validMove = false;

        const whitePieces =
            ["♙","♘","♖","♗","♕","♔"];

        const blackPieces =
            ["♟","♞","♜","♝","♛","♚"];

        const sameColor =
            (whitePieces.includes(piece) && whitePieces.includes(target)) ||
            (blackPieces.includes(piece) && blackPieces.includes(target));

        if (sameColor) {
            selectedSquare.classList.remove("selected");
            selectedSquare = null;
            return;
        }

        /*
         USHTARI I BARDHË
        */

        if (piece === "♙") {

            if (
                toCol === fromCol &&
                toRow === fromRow - 1 &&
                target === ""
            ) {
                validMove = true;
            }

            if (
                fromRow === 6 &&
                toCol === fromCol &&
                toRow === fromRow - 2 &&
                target === "" &&
                squares[from - 8].textContent === ""
            ) {
                validMove = true;
            }

            if (
                toRow === fromRow - 1 &&
                Math.abs(toCol - fromCol) === 1 &&
                blackPieces.includes(target)
            ) {
                validMove = true;
            }

            if (
                lastDoubleStep &&
                target === "" &&
                Math.abs(toCol - fromCol) === 1 &&
                toRow === fromRow - 1 &&
                lastDoubleStep === squares[from + (toCol - fromCol)] &&
                lastDoubleStep.textContent === "♟"
            ) {
                validMove = true;
            }
        }

        /*
         USHTARI I ZI
        */

        if (piece === "♟") {

            if (
                toCol === fromCol &&
                toRow === fromRow + 1 &&
                target === ""
            ) {
                validMove = true;
            }

            if (
                fromRow === 1 &&
                toCol === fromCol &&
                toRow === fromRow + 2 &&
                target === "" &&
                squares[from + 8].textContent === ""
            ) {
                validMove = true;
            }

            if (
                toRow === fromRow + 1 &&
                Math.abs(toCol - fromCol) === 1 &&
                whitePieces.includes(target)
            ) {
                validMove = true;
            }

            if (
                lastDoubleStep &&
                target === "" &&
                Math.abs(toCol - fromCol) === 1 &&
                toRow === fromRow + 1 &&
                lastDoubleStep === squares[from + (toCol - fromCol)] &&
                lastDoubleStep.textContent === "♙"
            ) {
                validMove = true;
            }
        }

        /*
         KALI
        */

        if (piece === "♘" || piece === "♞") {

            const rowDiff = Math.abs(toRow - fromRow);
            const colDiff = Math.abs(toCol - fromCol);

            if (
                (
                    (rowDiff === 2 && colDiff === 1) ||
                    (rowDiff === 1 && colDiff === 2)
                ) &&
                !sameColor
            ) {
                validMove = true;
            }
        }

        /*
         TORRA
        */

        if (piece === "♖" || piece === "♜") {

            if (
                (toRow === fromRow && toCol !== fromCol) ||
                (toCol === fromCol && toRow !== fromRow)
            ) {

                let blocked = false;

                const rowStep =
                    toRow === fromRow ? 0 :
                    (toRow > fromRow ? 1 : -1);

                const colStep =
                    toCol === fromCol ? 0 :
                    (toCol > fromCol ? 1 : -1);

                let r = fromRow + rowStep;
                let c = fromCol + colStep;

                while (r !== toRow || c !== toCol) {

                    if (squares[r * 8 + c].textContent !== "") {
                        blocked = true;
                        break;
                    }

                    r += rowStep;
                    c += colStep;
                }

                if (!blocked && !sameColor) {
                    validMove = true;
                }
            }
        }

        /*
         FILI
        */

        if (piece === "♗" || piece === "♝") {

            const rowDiff = Math.abs(toRow - fromRow);
            const colDiff = Math.abs(toCol - fromCol);

            if (rowDiff === colDiff && rowDiff !== 0) {

                let blocked = false;

                const rowStep =
                    toRow > fromRow ? 1 : -1;

                const colStep =
                    toCol > fromCol ? 1 : -1;

                let r = fromRow + rowStep;
                let c = fromCol + colStep;

                while (r !== toRow || c !== toCol) {

                    if (squares[r * 8 + c].textContent !== "") {
                        blocked = true;
                        break;
                    }

                    r += rowStep;
                    c += colStep;
                }

                if (!blocked && !sameColor) {
                    validMove = true;
                }
            }
        }

        /*
         MBRETËRESHA
        */

        if (piece === "♕" || piece === "♛") {

            const rowDiff = Math.abs(toRow - fromRow);
            const colDiff = Math.abs(toCol - fromCol);

            const straight =
                (toRow === fromRow && toCol !== fromCol) ||
                (toCol === fromCol && toRow !== fromRow);

            const diagonal =
                rowDiff === colDiff && rowDiff !== 0;

            if (straight || diagonal) {

                let blocked = false;

                const rowStep =
                    toRow === fromRow ? 0 :
                    (toRow > fromRow ? 1 : -1);

                const colStep =
                    toCol === fromCol ? 0 :
                    (toCol > fromCol ? 1 : -1);

                let r = fromRow + rowStep;
                let c = fromCol + colStep;

                while (r !== toRow || c !== toCol) {

                    if (squares[r * 8 + c].textContent !== "") {
                        blocked = true;
                        break;
                    }

                    r += rowStep;
                    c += colStep;
                }

                if (!blocked && !sameColor) {
                    validMove = true;
                }
            }
        }

        /*
         MBRETI
        */

        if (piece === "♔" || piece === "♚") {

            const rowDiff = Math.abs(toRow - fromRow);
            const colDiff = Math.abs(toCol - fromCol);

            if (
                rowDiff <= 1 &&
                colDiff <= 1 &&
                rowDiff + colDiff > 0 &&
                !sameColor
            ) {
                validMove = true;
            }
        }

        /*
         MOS LEJO KAPJEN E MBRETIT
        */

        if (
            target === "♔" ||
            target === "♚"
        ) {
            validMove = false;
        }

        /*
         LËVIZJA
        */

        if (validMove) {

            const isEnPassant =
                lastDoubleStep &&
                target === "" &&
                Math.abs(toCol - fromCol) === 1 &&
                (
                    (piece === "♙" && toRow === fromRow - 1) ||
                    (piece === "♟" && toRow === fromRow + 1)
                ) &&
                lastDoubleStep === squares[from + (toCol - fromCol)];

            let capturedPiece = target;
            let capturedSquare = this;

            if (isEnPassant) {

                capturedSquare =
                    lastDoubleStep;

                capturedPiece =
                    lastDoubleStep.textContent;

                lastDoubleStep.textContent = "";
            }

this.textContent = piece;

this.classList.remove("white-piece", "black-piece");

if (blackPieces.includes(piece)) {
    this.classList.add("black-piece");
} else if (whitePieces.includes(piece)) {
    this.classList.add("white-piece");
}

selectedSquare.textContent = "";
selectedSquare.classList.remove("white-piece", "black-piece");

            if (
                (piece === "♙" && fromRow === 6 && toRow === 4) ||
                (piece === "♟" && fromRow === 1 && toRow === 3)
            ) {
                lastDoubleStep = this;
            } else {
                lastDoubleStep = null;
            }

            const allSquares =
                Array.from(document.querySelectorAll(".square"));

            const ownKing =
                whitePieces.includes(piece)
                    ? allSquares.find(
                        square => square.textContent === "♔"
                    )
                    : allSquares.find(
                        square => square.textContent === "♚"
                    );

            if (ownKing && isKingInCheck(ownKing)) {

                this.textContent = capturedPiece;
                selectedSquare.textContent = piece;

                if (isEnPassant) {
                    capturedSquare.textContent = capturedPiece;
                }

                lastDoubleStep = null;

                alert("Nuk lejohet! Mbreti është në shah.");

            } else {
/* PROMOVIMI I USHTARIT */

if (piece === "♙" && toRow === 0) {

    const choice = prompt(
        "Promovimi:\n1 = ♕\n2 = ♖\n3 = ♗\n4 = ♘",
        "1"
    );

    if (choice === "2") {
        this.textContent = "♖";
    } else if (choice === "3") {
        this.textContent = "♗";
    } else if (choice === "4") {
        this.textContent = "♘";
    } else {
        this.textContent = "♕";
    }

    this.classList.remove("white-piece", "black-piece");
    this.classList.add("white-piece");
}

if (piece === "♟" && toRow === 7) {

    const choice = prompt(
        "Promovimi:\n1 = ♛\n2 = ♜\n3 = ♝\n4 = ♞",
        "1"
    );

    if (choice === "2") {
        this.textContent = "♜";
    } else if (choice === "3") {
        this.textContent = "♝";
    } else if (choice === "4") {
        this.textContent = "♞";
    } else {
        this.textContent = "♛";
    }

    this.classList.remove("white-piece", "black-piece");
    this.classList.add("black-piece");
}
                whiteTurn = !whiteTurn;
            }

            /*
             KONTROLLO SHAHUN
            */

            allSquares.forEach(function(square) {
                square.classList.remove("in-check");
            });

            const whiteKing =
                allSquares.find(
                    square => square.textContent === "♔"
                );

            const blackKing =
                allSquares.find(
                    square => square.textContent === "♚"
                );

            if (whiteKing && isKingInCheck(whiteKing)) {
                whiteKing.classList.add("in-check");
            }

            if (blackKing && isKingInCheck(blackKing)) {
                blackKing.classList.add("in-check");
            }
        }

        if (selectedSquare) {
            selectedSquare.classList.remove("selected");
            selectedSquare = null;
        }

    });
});

/*
 KONTROLLI I SHAHUT
*/

function isKingInCheck(king) {

    const squares =
        Array.from(document.querySelectorAll(".square"));

    const kingIndex =
        squares.indexOf(king);

    const kingRow =
        Math.floor(kingIndex / 8);

    const kingCol =
        kingIndex % 8;

    const enemyPieces =
        king.textContent === "♔"
            ? ["♟","♞","♝","♜","♛","♚"]
            : ["♙","♘","♖","♗","♕","♔"];

    for (let i = 0; i < 64; i++) {

        const piece =
            squares[i].textContent;

        if (!enemyPieces.includes(piece)) {
            continue;
        }

        const row =
            Math.floor(i / 8);

        const col =
            i % 8;

        const rowDiff =
            Math.abs(kingRow - row);

        const colDiff =
            Math.abs(kingCol - col);

        /*
         KALI
        */

        if (
            (piece === "♘" || piece === "♞") &&
            (
                (rowDiff === 2 && colDiff === 1) ||
                (rowDiff === 1 && colDiff === 2)
            )
        ) {
            return true;
        }

        /*
         USHTARI
        */

        if (
            piece === "♙" &&
            kingRow === row - 1 &&
            colDiff === 1
        ) {
            return true;
        }

        if (
            piece === "♟" &&
            kingRow === row + 1 &&
            colDiff === 1
        ) {
            return true;
        }

        /*
         MBRETI
        */

        if (
            (piece === "♔" || piece === "♚") &&
            rowDiff <= 1 &&
            colDiff <= 1 &&
            rowDiff + colDiff > 0
        ) {
            return true;
        }

        /*
         TORRA
        */

        if (
            (piece === "♖" || piece === "♜") &&
            (row === kingRow || col === kingCol)
        ) {

            let blocked = false;

            const rowStep =
                row === kingRow ? 0 :
                (kingRow > row ? 1 : -1);

            const colStep =
                col === kingCol ? 0 :
                (kingCol > col ? 1 : -1);

            let r = row + rowStep;
            let c = col + colStep;

            while (r !== kingRow || c !== kingCol) {

                if (
                    squares[r * 8 + c].textContent !== ""
                ) {
                    blocked = true;
                    break;
                }

                r += rowStep;
                c += colStep;
            }

            if (!blocked) {
                return true;
            }
        }

        /*
         FILI
        */

        if (
            (piece === "♗" || piece === "♝") &&
            rowDiff === colDiff &&
            rowDiff !== 0
        ) {

            let blocked = false;

            const rowStep =
                kingRow > row ? 1 : -1;

            const colStep =
                kingCol > col ? 1 : -1;

            let r = row + rowStep;
            let c = col + colStep;

            while (r !== kingRow || c !== kingCol) {

                if (
                    squares[r * 8 + c].textContent !== ""
                ) {
                    blocked = true;
                    break;
                }

                r += rowStep;
                c += colStep;
            }

            if (!blocked) {
                return true;
            }
        }

        /*
         MBRETËRESHA
        */

        if (
            (piece === "♕" || piece === "♛") &&
            (
                row === kingRow ||
                col === kingCol ||
                rowDiff === colDiff
            )
        ) {

            let blocked = false;

            const rowStep =
                row === kingRow ? 0 :
                (kingRow > row ? 1 : -1);

            const colStep =
                col === kingCol ? 0 :
                (kingCol > col ? 1 : -1);

            let r = row + rowStep;
            let c = col + colStep;

            while (r !== kingRow || c !== kingCol) {

                if (
                    squares[r * 8 + c].textContent !== ""
                ) {
                    blocked = true;
                    break;
                }

                r += rowStep;
                c += colStep;
            }

            if (!blocked) {
                return true;
            }
        }
    }

    return false;
}

</script>
